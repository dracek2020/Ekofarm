<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5b9e3e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>EKOfarm</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/img/icon-192.png">
<link rel="stylesheet" href="/css/style.css?v=15">
</head>
<body>
<!--APP-->
<canvas id="game"></canvas>

<div id="hud" hidden>
  <div id="top">
    <div class="pill" id="lvl"><span class="lvl-num" id="lvlNum">1</span><div class="xpbar"><div id="xpFill"></div></div></div>
    <div class="pill"><span data-ic="coin"></span><b id="coins">0</b></div>
    <button class="pill" id="siloBtn"><span data-ic="barn"></span><b id="silo">0/50</b></button>
  </div>
  <div id="bottom">
    <button class="big" id="buildBtn"><span data-ic="hammer"></span>Stavět</button>
    <button class="big" id="shopBtn"><span data-ic="cart"></span>Obchod</button>
    <button class="big" id="tasksBtn"><span data-ic="trophy"></span>Úkoly<i class="dot" id="tasksDot" hidden></i></button>
    <button class="big" id="siloBtn2"><span data-ic="barn"></span>Sklad</button>
    <button class="big" id="menuBtn"><span data-ic="gear"></span>Menu</button>
  </div>
  <button class="pill" id="newsBtn"><span data-ic="news"></span><b>Novinky</b><i class="dot" id="newsDot" hidden></i></button>
  <button class="pill" id="townBtn"><span data-ic="shop"></span><b>Městečko</b></button>
  <button class="pill" id="weatherBtn"></button>
  <button class="pill" id="chatBtn"><span data-ic="chat"></span><b>Chat</b><i class="dot" id="chatDot" hidden></i></button>
  <div id="tut" hidden><button class="tut-x" id="tutClose" aria-label="Zavřít">✕</button><span class="tut-ico" data-ic="farmer"></span><div id="tutText"></div>
    <div class="tut-btns"><button class="btn sm" id="tutNext">Dál</button><button class="btn sm alt" id="tutSkip">Přeskočit</button></div></div>
  <div id="fishGame" hidden><div class="fg-box"><button class="x fg-x" id="fgClose" aria-label="Zavřít">✕</button>
    <b id="fgTitle"></b>
    <div id="fgPlay"><div class="fg-water"><div id="fgBob" class="fg-bob"></div>
      <div class="fg-bar"><div id="fgZone" class="fg-zone"></div><div id="fgFish" class="fg-fish"></div></div>
      <div class="fg-prog"><div id="fgProg"></div></div></div>
      <p class="muted" id="fgHint"></p><button class="btn alt" id="fgQuit">Pustit rybu</button></div>
    <div id="fgResult" hidden><div id="fgResultText"></div><button class="btn" id="fgAgain">Rybařit znovu</button><button class="btn alt" id="fgDone">Hotovo</button></div>
  </div></div>
  <div id="visitBar" hidden><span id="visitText"></span><button class="btn sm" id="visitBack">Zpět domů</button></div>
  <div id="banner" hidden><span id="bannerText"></span>
    <span id="bannerSize" hidden>
      <span class="sz">↔ <button data-size="w:-1">−</button><button data-size="w:1">+</button></span>
      <span class="sz">↕ <button data-size="h:-1">−</button><button data-size="h:1">+</button></span>
    </span>
    <button id="bannerOk" class="ok" hidden>✓</button><button id="bannerClose">✕</button></div>
</div>

<div id="picker" class="sheet" hidden>
  <div class="sheet-head"><b>Co zasadit?</b><button class="x" data-close="picker">✕</button></div>
  <div id="cropList" class="crops"></div>
</div>

<div id="panel" class="sheet" hidden>
  <div class="sheet-head"><b id="panelTitle"></b><button class="x" data-close="panel">✕</button></div>
  <div id="panelBody"></div>
</div>

<div id="menuPanel" class="sheet" hidden>
  <div class="sheet-head"><b id="menuName">Farma</b><button class="x" data-close="menuPanel">✕</button></div>
  <p class="muted" id="menuMode"></p>
  <button class="btn alt" id="helpBtn"><span data-ic="book"></span> Jak hrát a pravidla</button>
  <button class="btn alt" id="pushBtn" hidden></button>
  <button class="btn alt" id="soundBtn"></button>
  <button class="btn alt" id="dayBtn"></button>
  <div id="gLinkWrap" hidden><p class="muted">Propoj farmu s Google účtem a přihlašuj se jedním klepnutím:</p><div id="gLinkBtn" class="gbtn"></div></div>
  <button class="btn" id="logoutBtn">Odhlásit</button>
</div>

<div id="login" hidden>
  <div class="card">
    <h1><span data-ic="wheat"></span> EKOfarm</h1>
    <p class="muted">Tvoje vlastní farma. Pěstuj, prodávej, rozšiřuj.</p>
    <input id="lName" placeholder="Jméno farmáře" autocomplete="username" maxlength="20">
    <input id="lPass" type="password" placeholder="Heslo" autocomplete="current-password">
    <p id="lErr" class="err"></p>
    <div id="gWrap" hidden><div class="or"><span>nebo</span></div><div id="gBtn" class="gbtn"></div></div>
    <button class="btn" id="loginBtn">Přihlásit</button>
    <button class="btn alt" id="regBtn">Založit novou farmu</button>
  </div>
</div>

<div id="toast"></div>
<div id="loading">Načítám farmu…<noscript> Zapni prosím JavaScript.</noscript></div>

<script>
// když se hra kvůli chybě nenačte, ukázat to místo věčného „Načítám…“
function showFatal(msg) {
  var el = document.getElementById('loading');
  if (!el || el.hidden) return;
  el.innerHTML = '<div style="text-align:center;padding:20px"><p>Hra se nenačetla.</p><p style="font-size:13px;opacity:.8">' +
    String(msg).replace(/</g, '&lt;') + '</p><button class="btn" style="max-width:240px;margin:12px auto" onclick="location.reload()">Načíst znovu</button></div>';
}
window.addEventListener('error', function (e) { showFatal(e.message || 'Chyba při načítání.'); });
window.addEventListener('unhandledrejection', function (e) { showFatal((e.reason && e.reason.message) || e.reason); });
setTimeout(function () { showFatal('Načítání trvá moc dlouho. Zkontroluj připojení.'); }, 15000);
</script>
<script type="module" src="/js/main.js?v=15"></script>
</body>
</html>
