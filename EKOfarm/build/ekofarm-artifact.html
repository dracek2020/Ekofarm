<meta charset="utf-8">
<title>EKOfarm – test</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
:root {
  --wood: #a0763f;
  --wood-d: #6f4f28;
  --paper: #fff8e7;
  --ink: #4a3218;
  --green: #5fae3a;
  --green-d: #3f8a25;
  --red: #c8452d;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #5b9e3e; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }

#top { position: fixed; top: calc(8px + var(--safe-t)); left: 8px; right: 8px; display: flex; gap: 8px; justify-content: space-between; pointer-events: none; }
.pill { pointer-events: auto; display: flex; align-items: center; gap: 6px; background: var(--paper); border: 3px solid var(--wood); border-radius: 999px; padding: 4px 12px 4px 6px; box-shadow: 0 3px 0 var(--wood-d); font-size: 16px; min-height: 38px; }
.pill b { font-weight: 800; }
#lvl { padding-left: 4px; min-width: 110px; }
.lvl-num { background: #4f8fd6; color: #fff; font-weight: 800; border-radius: 50%; width: 28px; height: 28px; display: grid; place-items: center; border: 2px solid #2f63a0; }
.xpbar { flex: 1; height: 10px; background: #e4d6b8; border-radius: 5px; overflow: hidden; min-width: 60px; }
#xpFill { height: 100%; width: 0; background: #ffc928; transition: width .3s; }

#bottom { position: fixed; bottom: calc(10px + var(--safe-b)); right: 10px; display: flex; gap: 8px; }
.big { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 16px; background: var(--paper); border: 3px solid var(--wood); box-shadow: 0 4px 0 var(--wood-d); font-size: 12px; font-weight: 700; }
.big span { font-size: 24px; line-height: 1.1; }
.big.on { background: #ffe58a; }
.big:active, .pill:active, .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--wood-d); }

#banner { position: fixed; left: 50%; transform: translateX(-50%); width: max-content; top: calc(104px + var(--safe-t)); background: rgba(74,50,24,.9); color: #fff; padding: 8px 8px 8px 16px; border-radius: 999px; display: flex; gap: 10px; align-items: center; font-weight: 600; font-size: 14px; max-width: calc(100% - 20px); }
#banner button { background: #fff3; border: 0; border-radius: 50%; width: 28px; height: 28px; }

.sheet { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + var(--safe-b)); width: min(560px, calc(100% - 16px)); background: var(--paper); border: 3px solid var(--wood); border-radius: 18px; box-shadow: 0 5px 0 var(--wood-d), 0 10px 30px #0004; padding: 12px; max-height: calc(100% - 160px - var(--safe-b) - var(--safe-t)); overflow: auto; z-index: 10; animation: up .18s ease-out; }
@keyframes up { from { transform: translate(-50%, 20px); opacity: 0; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 18px; }
.x { background: var(--red); color: #fff; border: 0; border-radius: 50%; width: 32px; height: 32px; font-weight: 800; }
.crops { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.crop { background: #fff; border: 2px solid #d8c39a; border-radius: 14px; padding: 8px; text-align: center; }
.crop .ico { font-size: 34px; }
.crop .nm { font-weight: 800; }
.crop .meta { font-size: 12px; color: #7a6040; }
.crop.locked { opacity: .45; filter: grayscale(1); }
.crop:not(.locked):active { background: #fff3c4; }

.row { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid #ead9b5; }
.row .ico { font-size: 28px; }
.row .info { flex: 1; }
.row .info small { color: #7a6040; display: block; }
.btn { display: block; width: 100%; padding: 12px; border-radius: 12px; border: 3px solid var(--green-d); background: var(--green); color: #fff; font-weight: 800; font-size: 16px; box-shadow: 0 3px 0 var(--green-d); margin-top: 8px; }
.btn.alt { background: #fff; color: var(--green-d); }
.btn.sm { display: inline-block; width: auto; padding: 6px 10px; font-size: 13px; margin: 0 0 0 4px; }
.muted { color: #7a6040; font-size: 14px; }
.empty { text-align: center; color: #7a6040; padding: 18px; }

#login { position: fixed; inset: 0; display: grid; place-items: center; background: linear-gradient(#8fd0f0, #bfe6a0 60%, #5b9e3e); padding: 16px; }
#login .card { width: min(380px, 100%); background: var(--paper); border: 3px solid var(--wood); border-radius: 20px; padding: 20px; box-shadow: 0 6px 0 var(--wood-d); text-align: center; }
#login h1 { margin: 0 0 4px; font-size: 32px; }
#login input { width: 100%; padding: 12px; margin-top: 10px; border-radius: 10px; border: 2px solid #d8c39a; font-size: 16px; background: #fff; color: var(--ink); }
.err { color: var(--red); min-height: 1.2em; font-weight: 600; margin: 8px 0 0; font-size: 14px; }

#toast { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(.9); background: rgba(74,50,24,.92); color: #fff; padding: 12px 18px; border-radius: 14px; font-weight: 700; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; text-align: center; max-width: 85%; }
#toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
#toast.lvlup { background: linear-gradient(#4f8fd6, #2f63a0); font-size: 20px; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; background: #5b9e3e; color: #fff; font-weight: 700; font-size: 18px; }

#banner .ok { background: var(--green); border: 2px solid #fff; border-radius: 999px; width: auto; height: 32px; padding: 0 14px; font-weight: 800; color: #fff; }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; }
.tab { flex: 1; padding: 8px 10px; border-radius: 10px; border: 2px solid #d8c39a; background: #fff; font-weight: 700; white-space: nowrap; }
.tab.on { background: #ffe58a; border-color: var(--wood); }
.crop.dim { opacity: .6; }
.crop .meta .miss { color: var(--red); font-weight: 700; }
.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
.slot { background: #fff; border: 2px dashed #d8c39a; border-radius: 12px; padding: 6px; text-align: center; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: #7a6040; }
.slot .ico { font-size: 24px; }
.slot.done { border: 2px solid var(--green); background: #eaf7dd; }
.slot.working { border-style: solid; }
.bar { width: 100%; height: 6px; background: #e4d6b8; border-radius: 3px; overflow: hidden; margin-top: 3px; }
.bar div { height: 100%; background: #6fbf3f; }
.row .bar { max-width: 180px; }

.or { display: flex; align-items: center; gap: 10px; color: #7a6040; font-size: 13px; margin: 14px 0 10px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: #d8c39a; }
.gbtn { display: flex; justify-content: center; min-height: 44px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
.stats div { background: #fff; border: 2px solid #d8c39a; border-radius: 12px; padding: 8px; text-align: center; }
.stats b { display: block; font-size: 20px; }
.stats small { color: #7a6040; font-size: 12px; }
#bottom .big { width: 60px; height: 60px; }

.orders { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 8px; }
.order { position: relative; background: #fff; border: 2px solid #d8c39a; border-radius: 14px; padding: 10px 8px 8px; display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center; min-height: 118px; }
.order.ready { border-color: var(--green); background: #f1faea; }
.order.wait { justify-content: center; color: #7a6040; border-style: dashed; }
.order .ico { font-size: 28px; }
.order .items { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; font-size: 20px; }
.order .items span { display: inline-flex; align-items: center; gap: 2px; }
.order .items b { font-size: 12px; }
.order .okq b { color: var(--green-d); }
.order .miss b { color: var(--red); }
.order .rew { font-weight: 800; font-size: 14px; }
.order .btn.sm { margin: 0; width: 100%; }
.order .btn.off { opacity: .45; }
.order .del { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: #ead9b5; color: #6f4f28; font-weight: 800; font-size: 12px; }

#newsBtn { position: fixed; left: 8px; top: calc(56px + var(--safe-t)); }
#newsBtn .dot { top: -2px; right: -2px; }
#bannerSize { display: inline-flex; gap: 8px; flex-wrap: wrap; }
#bannerSize .sz { display: inline-flex; align-items: center; gap: 3px; background: #fff2; border-radius: 999px; padding: 2px 6px; }
#bannerSize button { width: 28px; height: 28px; border-radius: 50%; border: 0; background: #fff; color: var(--ink); font-weight: 800; font-size: 16px; }

.ic { width: 1.25em; height: 1.25em; vertical-align: -0.25em; display: inline-block; }
.crop .ico .ic, .row .ico .ic, .slot .ico .ic, .order .ico .ic { width: 36px; height: 36px; }
.order .items .ic { width: 26px; height: 26px; }
.big span .ic { width: 28px; height: 28px; }
.pill span .ic { width: 24px; height: 24px; vertical-align: middle; }
#login h1 .ic { width: 34px; height: 34px; }
.big { position: relative; }
.dot { position: absolute; top: 4px; right: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--red); border: 2px solid #fff; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 8px 0; }
.day { background: #fff; border: 2px solid #d8c39a; border-radius: 10px; padding: 4px 2px; text-align: center; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.day span { font-weight: 800; font-size: 14px; }
.day small { font-size: 10px; color: #7a6040; }
.day.got { opacity: .5; }
.day.today { border-color: var(--green); background: #eaf7dd; box-shadow: 0 0 0 2px #bfe6a0; }
.star { color: #d8c39a; font-size: 14px; }
.star.on { color: #f5b82e; }
.row .btn.sm.off { opacity: .4; }
.row.me { background: #fff3c4; border-radius: 10px; }
.rank { font-weight: 800; width: 32px; text-align: center; font-size: 18px; }
.up { color: var(--green-d); font-weight: 700; }
.down { color: var(--red); font-weight: 700; }
#bottom { gap: 6px; }
#bottom .big { width: 58px; height: 58px; font-size: 11px; }

.landmap { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; max-width: 220px; margin: 6px auto 10px; transform: rotate(45deg) scale(.72); }
.lm { aspect-ratio: 1; border-radius: 6px; border: 2px solid #8a6a3f; background: #5e9c3d; display: grid; place-items: center; font-weight: 800; color: #fff; }
.lm > * { transform: rotate(-45deg); }
.lm.farm, .lm.own { background: #7cc251; }
.lm.sel { outline: 3px solid #ffe58a; }
.crop.sel { border-color: var(--wood); background: #fff3c4; }

.cat { grid-column: 1 / -1; font-weight: 800; margin: 6px 0 0; color: var(--wood-d); }
.upg { background: #fff; border: 2px solid #d8c39a; border-radius: 12px; padding: 10px; margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.upg .need { display: flex; flex-wrap: wrap; gap: 8px; font-weight: 700; font-size: 14px; }
.upg .okq { color: var(--green-d); } .upg .miss { color: var(--red); }
.upg .btn.sm { align-self: flex-start; margin: 0; }
.btn.sm.off, .btn.off { opacity: .45; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.chip { border: 2px solid #d8c39a; background: #fff; border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 700; }
.chip.on { background: #ffe58a; border-color: var(--wood); }
.hire { display: flex; flex-wrap: wrap; gap: 6px; }
.hire .btn.sm { margin: 0; }
.news { background: #fff; border: 2px solid #d8c39a; border-radius: 12px; padding: 10px; margin-bottom: 8px; }
.news ul { margin: 6px 0 0; padding-left: 20px; font-size: 14px; }
.news li { margin: 3px 0; }

/* v10: městečko, návštěvy, tržiště */
#townBtn { position: fixed; right: 8px; top: calc(56px + var(--safe-t)); }
#visitBar { font-size: 14px; position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + var(--safe-b)); background: rgba(74,50,24,.92); color: #fff; padding: 8px 8px 8px 16px; border-radius: 999px; display: flex; gap: 10px; align-items: center; font-weight: 600; max-width: calc(100% - 20px); }
#visitBar .btn { width: auto; margin: 0; }
body.visiting #bottom, body.visiting #newsBtn, body.visiting #townBtn, body.visiting #banner { display: none !important; }
.row.dim { opacity: .55; }
.mform { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
.mform label { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper b { min-width: 64px; text-align: center; }
.stepper button { min-width: 34px; height: 32px; border-radius: 10px; border: 2px solid #d8c39a; background: #fff; font-weight: 800; color: var(--ink); }

/* v11: průvodce, rybaření, nápověda */
#tut { position: fixed; left: 50%; transform: translateX(-50%); top: calc(104px + var(--safe-t)); width: min(520px, calc(100% - 16px)); background: var(--paper); border: 3px solid var(--wood); border-radius: 16px; box-shadow: 0 4px 0 var(--wood-d); padding: 10px 12px; display: flex; gap: 10px; align-items: center; z-index: 5; font-size: 14px; }
#tut .tut-ico .ic { width: 40px; height: 40px; }
#tutText { flex: 1; }
#tutText small { color: #8a6a3a; font-weight: 700; }
.tut-btns { display: flex; flex-direction: column; gap: 4px; }
.tut-btns .btn.sm { margin: 0; }
body.visiting #tut { display: none !important; }
#fishGame { position: fixed; inset: 0; background: rgba(20,40,70,.55); z-index: 30; display: flex; align-items: center; justify-content: center; touch-action: none; user-select: none; -webkit-user-select: none; }
#fishGame[hidden] { display: none; }
.fg-box { background: var(--paper); border: 3px solid var(--wood); border-radius: 18px; box-shadow: 0 5px 0 var(--wood-d); padding: 14px; width: min(360px, calc(100% - 24px)); text-align: center; }
#fgTitle { display: block; font-size: 19px; margin-bottom: 8px; min-height: 26px; }
.fg-water { position: relative; height: 300px; border-radius: 14px; background: linear-gradient(#6fb0e8, #2f6fb5); display: flex; justify-content: center; gap: 14px; padding: 10px; }
.fg-bar { position: relative; width: 56px; height: 100%; background: rgba(10,30,60,.45); border-radius: 10px; border: 2px solid #cfe8f5; overflow: hidden; }
.fg-zone { position: absolute; left: 0; right: 0; background: rgba(120,230,110,.55); border: 2px solid #b8f5a8; border-radius: 6px; }
.fg-zone.on { background: rgba(120,230,110,.85); }
.fg-fish { position: absolute; left: 50%; width: 30px; height: 28px; transform: translateX(-50%); }
.fg-fish .ic { width: 30px; height: 28px; }
.fg-prog { position: relative; width: 14px; height: 100%; background: rgba(10,30,60,.45); border-radius: 7px; overflow: hidden; }
.fg-prog div { position: absolute; bottom: 0; left: 0; right: 0; background: #f5c542; }
.fg-bob { position: absolute; left: 22%; top: 40%; width: 18px; height: 26px; border-radius: 50% 50% 40% 40%; background: linear-gradient(#e0402d 50%, #fff 50%); animation: bob 1.6s ease-in-out infinite; }
.fg-bob.bite { animation: bite .18s linear infinite; }
.fg-bob.hide { display: none; }
@keyframes bob { 50% { transform: translateY(6px); } }
@keyframes bite { 0% { transform: translate(-3px, 4px); } 50% { transform: translate(3px, 14px); } 100% { transform: translate(-3px, 4px); } }
.fg-big .ic { width: 72px; height: 72px; }
#fgResult .btn { margin-top: 8px; }
.chip.dim { opacity: .5; }
table.help { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 8px; }
table.help th, table.help td { border-bottom: 1px solid #e4d6b8; padding: 5px 4px; text-align: left; vertical-align: top; }
table.help tr.me td { background: #fff3b0; }
table.help tr.dim td { opacity: .55; }
table.help .ic { width: 1.1em; height: 1.1em; }

</style>

<canvas id="game"></canvas>

<div id="hud" hidden>
  <div id="top">
    <div class="pill" id="lvl"><span class="lvl-num" id="lvlNum">1</span><div class="xpbar"><div id="xpFill"></div></div></div>
    <div class="pill"><span data-ic="coin"></span><b id="coins">0</b></div>
    <button class="pill" id="siloBtn"><span data-ic="barn"></span><b id="silo">0/50</b></button>
  </div>
  <div id="bottom">
    <button class="big" id="buildBtn"><span data-ic="hammer"></span>Stavět</button>
    <button class="big" id="shopBtn"><span data-ic="cart"></span>Obchod</button>
    <button class="big" id="tasksBtn"><span data-ic="trophy"></span>Úkoly<i class="dot" id="tasksDot" hidden></i></button>
    <button class="big" id="siloBtn2"><span data-ic="barn"></span>Sklad</button>
    <button class="big" id="menuBtn"><span data-ic="gear"></span>Menu</button>
  </div>
  <button class="pill" id="newsBtn"><span data-ic="news"></span><b>Novinky</b><i class="dot" id="newsDot" hidden></i></button>
  <button class="pill" id="townBtn"><span data-ic="shop"></span><b>Městečko</b></button>
  <div id="tut" hidden><span class="tut-ico" data-ic="farmer"></span><div id="tutText"></div>
    <div class="tut-btns"><button class="btn sm" id="tutNext">Dál</button><button class="btn sm alt" id="tutSkip">Přeskočit</button></div></div>
  <div id="fishGame" hidden><div class="fg-box">
    <b id="fgTitle"></b>
    <div id="fgPlay"><div class="fg-water"><div id="fgBob" class="fg-bob"></div>
      <div class="fg-bar"><div id="fgZone" class="fg-zone"></div><div id="fgFish" class="fg-fish"></div></div>
      <div class="fg-prog"><div id="fgProg"></div></div></div>
      <p class="muted" id="fgHint"></p><button class="btn alt" id="fgQuit">Pustit rybu</button></div>
    <div id="fgResult" hidden><div id="fgResultText"></div><button class="btn" id="fgAgain">Rybařit znovu</button><button class="btn alt" id="fgDone">Hotovo</button></div>
  </div></div>
  <div id="visitBar" hidden><span id="visitText"></span><button class="btn sm" id="visitBack">Zpět domů</button></div>
  <div id="banner" hidden><span id="bannerText"></span>
    <span id="bannerSize" hidden>
      <span class="sz">↔ <button data-size="w:-1">−</button><button data-size="w:1">+</button></span>
      <span class="sz">↕ <button data-size="h:-1">−</button><button data-size="h:1">+</button></span>
    </span>
    <button id="bannerOk" class="ok" hidden>✓</button><button id="bannerClose">✕</button></div>
</div>

<div id="picker" class="sheet" hidden>
  <div class="sheet-head"><b>Co zasadit?</b><button class="x" data-close="picker">✕</button></div>
  <div id="cropList" class="crops"></div>
</div>

<div id="panel" class="sheet" hidden>
  <div class="sheet-head"><b id="panelTitle"></b><button class="x" data-close="panel">✕</button></div>
  <div id="panelBody"></div>
</div>

<div id="menuPanel" class="sheet" hidden>
  <div class="sheet-head"><b id="menuName">Farma</b><button class="x" data-close="menuPanel">✕</button></div>
  <p class="muted" id="menuMode"></p>
  <button class="btn alt" id="helpBtn"><span data-ic="book"></span> Jak hrát a pravidla</button>
  <button class="btn alt" id="pushBtn" hidden></button>
  <button class="btn alt" id="soundBtn"></button>
  <button class="btn alt" id="dayBtn"></button>
  <div id="gLinkWrap" hidden><p class="muted">Propoj farmu s Google účtem a přihlašuj se jedním klepnutím:</p><div id="gLinkBtn" class="gbtn"></div></div>
  <button class="btn" id="logoutBtn">Odhlásit</button>
</div>

<div id="login" hidden>
  <div class="card">
    <h1><span data-ic="wheat"></span> EKOfarm</h1>
    <p class="muted">Tvoje vlastní farma. Pěstuj, prodávej, rozšiřuj.</p>
    <input id="lName" placeholder="Jméno farmáře" autocomplete="username" maxlength="20">
    <input id="lPass" type="password" placeholder="Heslo" autocomplete="current-password">
    <p id="lErr" class="err"></p>
    <div id="gWrap" hidden><div class="or"><span>nebo</span></div><div id="gBtn" class="gbtn"></div></div>
    <button class="btn" id="loginBtn">Přihlásit</button>
    <button class="btn alt" id="regBtn">Založit novou farmu</button>
  </div>
</div>

<div id="toast"></div>
<div id="loading">Načítám farmu…<noscript> Zapni prosím JavaScript.</noscript></div>

<script>
// když se hra kvůli chybě nenačte, ukázat to místo věčného „Načítám…“
function showFatal(msg) {
  var el = document.getElementById('loading');
  if (!el || el.hidden) return;
  el.innerHTML = '<div style="text-align:center;padding:20px"><p>Hra se nenačetla.</p><p style="font-size:13px;opacity:.8">' +
    String(msg).replace(/</g, '&lt;') + '</p><button class="btn" style="max-width:240px;margin:12px auto" onclick="location.reload()">Načíst znovu</button></div>';
}

const questBonus = farm => ({ coins: 100 + 10 * farm.level, xp: 10 + farm.level });
function genQuests(farm, day) {
  const r = seeded(`${farm.created}:${day}:q`);
  const pool = Object.keys(QUEST_TYPES).filter(k => !QUEST_TYPES[k].need || QUEST_TYPES[k].need(farm));
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const L = Math.min(farm.level, 60);
  const list = [];
  for (let i = 0; i < QUEST_COUNT; i++) {
    const k = pool[i % pool.length], q = QUEST_TYPES[k];
    const mult = 1 + Math.floor(i / pool.length) * 0.8;
    const n = Math.max(1, Math.round((q.base + q.per * L) * mult * (0.85 + r() * 0.3)));
    list.push({ t: k, n, coins: Math.round(n * q.pay * (1 + L * 0.04)) + 5, xp: 2 + Math.floor(L / 3), done: false });
  }
  return list;
}
// úkoly pro dnešek; fresh = nový den (farma se nemění, jen se vrátí, jak by vypadaly)
function dailyQuests(farm, now) {
  const day = dayKey(now);
  if (farm.quests && farm.quests.day === day) return farm.quests;
  return { day, base: { ...farm.stats }, list: genQuests(farm, day), bonus: false };
}
function ensureQuests(farm, now) {
  if (!farm.quests || farm.quests.day !== dayKey(now)) farm.quests = dailyQuests(farm, now);
  return farm.quests;
}
const questProgress = (farm, qs, q) => Math.max(0, (farm.stats[q.t] || 0) - (qs.base[q.t] || 0));

const MARKET_SLOTS = 8;      // kolik nabídek může mít hráč najednou
const MARKET_MAX = 3;        // nejvýš 3× skutečná cena
const marketBase = l => (l.machine ? MACHINES[l.machine].cost : ITEMS[l.item].price * l.qty);
const marketMaxPrice = l => Math.max(1, Math.round(marketBase(l) * MARKET_MAX));
// vyjme zboží nebo stroj z farmy prodávajícího; vrací { ok, listing: { item, qty } | { machine } }
function marketTake(farm, a, now) {
  normalize(farm);
  if (!isInt(a.price) || a.price < 1) return fail('bad_price');
  let listing;
  if (a.machine !== undefined) {
    const m = findMachine(farm, a.machine);
    if (!m) return fail('no_machine');
    if (machineJob(farm, m.id, now)) return fail('machine_busy');
    if (farm.helper && farm.helper.tractor && MACHINES[m.model].type === 'tractor' && farm.machines.filter(x => MACHINES[x.model].type === 'tractor').length === 1) farm.helper.tractor = false;
    listing = { machine: m.model };
    if (a.price > marketMaxPrice(listing)) return fail('bad_price');
    farm.machines = farm.machines.filter(x => x.id !== m.id);
  } else {
    const it = getItem(a.item);
    if (!it || !isInt(a.qty) || a.qty < 1 || a.qty > 999) return fail('bad_action');
    if (have(farm, it.id) < a.qty) return fail('not_enough');
    listing = { item: it.id, qty: a.qty };
    if (a.price > marketMaxPrice(listing)) return fail('bad_price');
    takeItem(farm, it.id, a.qty);
  }
  return { ok: true, listing: { ...listing, price: a.price } };
}
// vloží zboží z nabídky do farmy (koupě nebo vrácení); pay = kolik zaplatí
function marketGive(farm, l, pay) {
  normalize(farm);
  if (farm.coins < pay) return fail('no_coins');
  if (l.machine) {
    if (!own(MACHINES, l.machine)) return fail('bad_action');
    if (farm.machines.some(x => x.model === l.machine)) return fail('owned');
    if (isVehicle(l.machine) && vehicleCount(farm) >= garageSlots(farm)) return fail(countKind(farm, 'stodola') ? 'garage_full' : 'no_garage');
    farm.machines.push({ id: farm.nextId++, model: l.machine });
  } else {
    if (!getItem(l.item)) return fail('bad_action');
    if (siloFree(farm) < l.qty) return fail('silo_full');
    farm.silo[l.item] = (farm.silo[l.item] || 0) + l.qty;
  }
  farm.coins -= pay;
  return { ok: true };
}
// prodávajícímu přijdou peníze za prodané nabídky
function marketPayout(farm, coins) {
  farm.coins += coins;
  addStat(farm, 'sold', coins);
}

// doplní chybějící části u starších farem
function normalize(farm) {
  if (!Array.isArray(farm.objects)) farm.objects = [];
  if (!farm.nextId) farm.nextId = 1;
  if (!farm.siloCap) farm.siloCap = SILO_START;
  if (!Array.isArray(farm.pending)) farm.pending = [];
  if (!Array.isArray(farm.machines)) farm.machines = [];
  if (!Array.isArray(farm.land)) farm.land = [];
  if (!farm.stats) farm.stats = {};
  for (const k of STAT_KEYS) if (!farm.stats[k]) farm.stats[k] = 0;
  if (!farm.ach) farm.ach = {};
  if (!farm.daily) farm.daily = { day: '', streak: 0 };
  // v3/v4: traktor a kombajn stály na mapě – převést do garáže
  const OLD = { traktor: 'brazda60', kombajn: 'klas4' };
  for (const o of farm.objects.filter(o => OLD[o.kind])) {
    if (!farm.machines.some(m => m.model === OLD[o.kind])) farm.machines.push({ id: o.id, model: OLD[o.kind] });
  }
  farm.objects = farm.objects.filter(o => !OLD[o.kind]);
  if (!farm.objects.some(o => o.kind === 'statek')) {
    // starší farma: statek doprostřed, nebo na nejbližší volné místo
    let pos = fits(farm, MAIN_POS[0], MAIN_POS[1], 3, 3) ? MAIN_POS : null;
    for (let r = 1; !pos && r < GRID_W; r++) {
      for (let y = MAIN_POS[1] - r; !pos && y <= MAIN_POS[1] + r; y++) {
        for (let x = MAIN_POS[0] - r; !pos && x <= MAIN_POS[0] + r; x++) if (fits(farm, x, y, 3, 3)) pos = [x, y];
      }
    }
    if (pos) farm.objects.unshift({ id: farm.nextId++, kind: 'statek', x: pos[0], y: pos[1] });
  }
  if (!farm.objects.some(o => o.kind === 'sklad') && !farm.pending.includes('sklad')) farm.pending.push('sklad');
  for (const o of farm.objects) if (!o.lvl && UP_BASE[BUILDINGS[o.kind].type]) o.lvl = 1;
  // v10: prodejna strojů a stánek se přestěhovaly do městečka (úroveň zůstává)
  if (!farm.town) farm.town = {};
  for (const k of TOWN_KINDS) {
    const o = farm.objects.find(x => x.kind === k);
    farm.town[k] = Math.max(farm.town[k] || 1, o ? objLevel(o) : 1);
  }
  farm.objects = farm.objects.filter(o => !TOWN_KINDS.includes(o.kind));
  if (farm.machines.some(m => isVehicle(m.model)) && !farm.objects.some(o => o.kind === 'stodola') && !farm.pending.includes('stodola')) farm.pending.push('stodola');
  if (farm.helper === undefined) farm.helper = null;
  if (farm.tut === undefined) farm.tut = farm.level >= 2 || farm.plots.length > FREE_PLOTS ? TUTORIAL_DONE : 0;
  if (!farm.seed) farm.seed = ((farm.created || 1) % 2147483646) + 1;
  if (!Array.isArray(farm.orders)) farm.orders = [];
  while (farm.orders.length < ORDER_SLOTS) farm.orders.push(genOrder(farm, 0));
  farm.v = RULES_VERSION;
  return farm;
}

function levelForXp(xp) {
  let l = 1;
  while (l < MAX_LEVEL && xp >= LEVEL_XP[l + 1]) l++;
  return l;
}

// { cur, need } – kolik XP v rámci aktuální úrovně
function levelProgress(farm) {
  if (farm.level >= MAX_LEVEL) return { cur: 1, need: 1 };
  const base = LEVEL_XP[farm.level];
  return { cur: farm.xp - base, need: LEVEL_XP[farm.level + 1] - base };
}

function addXp(farm, n) {
  const before = farm.level;
  farm.xp += n;
  farm.level = levelForXp(farm.xp);
  return farm.level > before ? farm.level : 0;
}

function siloUsed(farm) {

}

const ANIMAL_PRODUCTS = new Set(['vejce', 'mleko', 'maso', 'vlna', 'plast']);
function statOf(id) {
  if (FISH[id]) return 'fish';

  if (FRUITS[id]) return 'fruit';

}
function addStat(farm, key, n) { farm.stats[key] = (farm.stats[key] || 0) + n; }
function addItem(farm, id, n) {

}
function takeItem(farm, id, n) {

}
const have = (farm, id) => farm.silo[id] || 0;
// zaplatí osivo na n políček: nejdřív semena ze skladu, zbytek mincemi; null = nemá na to
function payCrop(farm, c, n) {

  if (farm.coins < coins) return null;
  if (seeds) takeItem(farm, 's_' + c.id, seeds);

}

// stav stromu v sadu: 'empty' | 'growing' | 'ready' | 'dead'
function treeState(obj, now) {

  const t = TREES[obj.tree];
  if (now >= obj.readyAt) return { state: 'ready', progress: 1, left: 0 };
  const total = (obj.left === t.harvests ? t.first : t.regrow) * 1000;
  return { state: 'growing', progress: Math.max(0, 1 - (obj.readyAt - now) / total), left: Math.ceil((obj.readyAt - now) / 1000) };
}

}

// stav velkého pole: empty | sowing | growing | ready | harvesting | unload
function fieldState(o, now) {
  const j = o.job;
  if (j && now < j.end) {
    const map = { sow: 'sowing', harvest: 'harvesting', plow: 'plowing', bale: 'baling' };
    return { state: map[j.type], progress: (now - j.start) / (j.end - j.start), left: Math.ceil((j.end - now) / 1000) };
  }
  if (o.load && o.load.qty > 0) return { state: 'unload', progress: 1, left: 0, stock: o.load.qty, item: o.load.item };
  if (o.crop) {
    if (now >= o.readyAt) return { state: 'ready', progress: 1, left: 0 };
    const total = o.readyAt - j.end;
    return { state: 'growing', progress: Math.max(0, (now - j.end) / total), left: Math.ceil((o.readyAt - now) / 1000) };
  }
  return { state: 'empty', progress: 0, left: 0, soil: o.soil || 'raw', straw: !!o.straw };
}

function hashStr(str) {
  let h = 2166136261;
  for (const ch of str) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
  return h;
}
function seeded(str) {

// ---------- zásoba, která přibývá s časem (ryby v rybníku, plástve ve včelíně) ----------
// o.sc = kolik bylo v čase o.st; každých iv ms přibude 1, nejvýš cap
function stockState(o, now, cap, iv) {
  const el = Math.max(0, now - (o.st || 0));
  const count = Math.min(cap, (o.sc || 0) + Math.floor(el / iv));
  return { count, cap, next: count >= cap ? 0 : iv - (el % iv) };
}
function takeStock(o, now, cap, iv, n) {
  const s = stockState(o, now, cap, iv);
  o.st = s.count >= cap ? now : now - (iv - s.next);
  o.sc = s.count - n;
}
const near = (a, b, r) => {
  const sa = objSize(a), sb = objSize(b);
  return a.x - r < b.x + sb.w && b.x < a.x + sa.w + r && a.y - r < b.y + sb.h && b.y < a.y + sa.h + r;

const POND_IV = 10 * 60000;
const HIVE_IV = 20 * 60000;
const pondCap = o => 4 + objLevel(o);
const pondIv = o => Math.round(POND_IV * speedMult(o));

const hiveFlowers = (farm, o) => farm.objects.some(x => (x.kind === 'kvetiny' || x.kind === 'jablon' || (x.kind === 'sad' && x.tree && !x.dead)) && near(o, x, 4));
const hiveIv = (farm, o) => Math.round(HIVE_IV * speedMult(o) * (hiveFlowers(farm, o) ? 0.75 : 1));
const hiveStock = (farm, o, now) => stockState(o, now, hiveCap(o), hiveIv(farm, o));

const beeBonus = (farm, o) => (farm.objects.some(x => x.kind === 'vcelin' && near(o, x, 4)) ? 1 : 0);

// která ryba zabere (podle úrovně, s lepší udicí častěji vzácná)
function pickFish(farm, roll) {
  const good = farm.machines.some(m => m.model === 'udice2');
  const list = FISH_LIST.filter(f => f.level <= farm.level);
  const w = f => f.w * (good && f.diff >= 0.5 ? 1.8 : 1);
  let x = roll * list.reduce((n, f) => n + w(f), 0);
  for (const f of list) { x -= w(f); if (x < 0) return f.id; }
  return list[list.length - 1].id;
}
const HOOK_MS = 120000;   // ryba na háčku vydrží 2 minuty

// ---------- průvodce a upozornění ----------
// co se na farmě stalo hotovým mezi časy from a to (pro upozornění v telefonu)
function readyEvents(farm, from, to) {
  const inR = t => t > from && t <= to;
  const ev = [];
  const crops = farm.plots.filter(p => p.crop && inR(p.planted + CROPS[p.crop].time * 1000)).length;
  if (crops) ev.push({ k: 'crop', text: `Úroda je zralá na ${crops} ${crops === 1 ? 'poli' : 'polích'}` });
  for (const o of farm.objects) {
    const d = BUILDINGS[o.kind];
    if (d.type === 'factory' && (o.queue || []).some(q => inR(q.end))) ev.push({ k: 'factory', text: `${d.name}: výrobek je hotový` });
    if (d.type === 'pen' && (o.animals || []).some(x => x.fed && inR(x.fed + (x.dur || ANIMALS[d.animal].time * 1000)))) ev.push({ k: 'pen', text: `${d.name}: zvířata mají hotovo` });
    if (d.type === 'orchard' && o.tree && !o.dead && inR(o.readyAt)) ev.push({ k: 'tree', text: `${TREES[o.tree].name}: ovoce je zralé` });
    if (d.type === 'bigfield' && o.crop && inR(o.readyAt)) ev.push({ k: 'field', text: `Velké pole: ${CROPS[o.crop].name} je zralá` });
    if (d.type === 'hive') { const s = hiveStock(farm, o, to); if (s.count >= s.cap && hiveStock(farm, o, from).count < s.cap) ev.push({ k: 'hive', text: 'Včelín je plný medu' }); }
  }
  if (farm.helper && inR(farm.helper.until)) ev.push({ k: 'helper', text: 'Pomocník skončil práci' });
  const seen = new Set();
  return ev.filter(e => (e.k === 'factory' || e.k === 'pen' ? true : !seen.has(e.k) && seen.add(e.k)));
}
const TUTORIAL_DONE = 99;

// cena vylepšení budovy na další úroveň (stejná na serveru i v prohlížeči)
function upgradeCost(o) {
  const d = BUILDINGS[o.kind];
  if (!UP_BASE[d.type]) return null;
  const L = objLevel(o);
  if (L >= MAX_BLD_LEVEL) return null;
  const coins = Math.round(UP_BASE[d.type] * Math.pow(L, 1.5));
  const tier = Math.min(MAX_LEVEL, 1 + Math.round(L * 1.6));
  const pool = orderableItems(tier, L).filter(id => ITEMS[id].price <= coins);
  const r = seeded(o.kind + ':' + L);
  const k = Math.min(pool.length, L < 4 ? 2 : 3);
  const items = [];
  const left = [...pool];
  for (let i = 0; i < k; i++) {
    const id = left.splice(Math.floor(r() * left.length), 1)[0];
    items.push({ item: id, qty: Math.max(2, Math.min(40, Math.round(coins * 0.5 / k / ITEMS[id].price))) });
  }
  return { level: L + 1, coins, items };
}

// co přinese další úroveň (text pro panel)
function upgradeEffect(o) {
  const d = BUILDINGS[o.kind], L = objLevel(o) + 1;
  switch (d.type) {
    case 'main': {
      const nb = BUILDING_LIST.filter(b => b.st === L).map(b => b.name);
      const f = { objects: [{ kind: 'statek', lvl: L }] };
      return (nb.length ? `odemkne ${nb.join(', ')}; ` : '') + `až ${maxPlots(f)} polí, ${maxOrchards(f)} sadů, ${maxBigFields(f)}× velké pole, zakázky +${3 * (L - 1)} % mincí`;
    }
    case 'storage': return 'sklad +40 míst';
    case 'pond': return `až ${4 + L} ryb v rybníku, doplňuje se o ${5 * (L - 1)} % rychleji`;
    case 'hive': return `až ${3 + Math.floor(L / 2)} pláství, včely o ${5 * (L - 1)} % rychlejší`;
    case 'garage': return `místo pro ${1 + L} strojů`;
    case 'dealer': return `stroje o ${3 * (L - 1)} % levněji`;
    case 'stall': return 'víc nabídek a lepší ceny';
    case 'factory': return `výroba o ${5 * (L - 1)} % rychlejší${(L - 1) % 3 === 0 ? ', +1 místo ve frontě' : ''}`;
    case 'pen': return `zvířata o ${5 * (L - 1)} % rychlejší${(L - 1) % 3 === 0 ? ', +1 místo v ohradě' : ''}`;
  }

}

// sklizeň jednoho malého pole (s 8% šancí na dvojitou „bohatou úrodu“)
function harvestPlot(farm, p) {
  const c = CROPS[p.crop];
  const bonus = rnd(farm) < 0.08 && siloFree(farm) >= c.yield * 2;
  const qty = bonus ? c.yield * 2 : c.yield;
  addItem(farm, c.id, qty);
  p.crop = null;
  p.planted = 0;
  return qty;
}

// ---------- pomocník ----------
const HELPER_PLANS = [{ h: 1, cost: 120 }, { h: 4, cost: 400 }, { h: 8, cost: 700 }];
const HELPER_LEVEL = 3;
const helperInterval = farm => (hasTool(farm, 'helper') && farm.machines.some(m => m.model === 'motyka') ? 10 : 20);
function helperCapacity(farm) {
  return 2 + (farm.machines.some(m => m.model === 'kolecko') ? 2 : 0) + (farm.helper && farm.helper.tractor && hasMachine(farm, 'tractor') ? 3 : 0);
}
const helperActive = (farm, now) => !!farm.helper && now < farm.helper.until;

// pomocník pracuje v pravidelných kolech; dopočítá se vždy až do „teď“ (stejně na serveru i v prohlížeči)
function runHelper(farm, now) {
  const h = farm.helper;
  if (!h) return [];
  const end = Math.min(now, h.until);
  const iv = helperInterval(farm) * 1000;
  const touched = [];
  let t = h.last + iv;
  for (let guard = 0; t <= end && guard < 6000; guard++, t += iv) {
    let cap = helperCapacity(farm);
    const plots = [...farm.plots].sort((a, b) => a.y - b.y || a.x - b.x);
    for (const p of plots) {
      if (cap <= 0) break;
      if (p.crop && plotState(p, t).state === 'ready' && siloFree(farm) >= CROPS[p.crop].yield) {
        const c = CROPS[p.crop];
        harvestPlot(farm, p);
        addXp(farm, c.xp);
        h.n = (h.n || 0) + 1; cap--; touched.push([p.x, p.y]);
      }
    }
    const c = h.crop && getCrop(h.crop);
    if (c && farm.level >= c.level) {
      for (const p of plots) {
        if (cap <= 0) break;
        if (!p.crop) {
          if (!payCrop(farm, c, 1)) break;
          addStat(farm, 'plant', 1);
          p.crop = c.id; p.planted = t;
          h.n = (h.n || 0) + 1; cap--; touched.push([p.x, p.y]);
        }
      }
    }
    h.last = t;
  }
  return touched;
}

const STALL_PERIOD = 2 * 3600 * 1000;
function stallOffers(farm, now) {
  const period = Math.floor(now / STALL_PERIOD);
  const L = townLevel(farm, 'stanek');
  const lv = farm.stall && farm.stall.p === period ? farm.stall.lv : farm.level;
  const r = seeded(`${farm.created}:${period}:${L}`);
  const pool = orderableItems(lv);
  const pick = n => { const left = [...pool], out = []; for (let i = 0; i < n && left.length; i++) out.push(left.splice(Math.floor(r() * left.length), 1)[0]); return out; };
  const buy = pick(4 + Math.floor((L - 1) / 3)).map(id => ({
    item: id, qty: 3 + Math.floor(r() * (ITEMS[id].price < 20 ? 8 : 4)),
    price: Math.ceil(ITEMS[id].price * (1.6 - 0.03 * (L - 1))),
  }));
  const sell = pick(3).map(id => ({
    item: id, qty: 5 + Math.floor(r() * 11),
    price: Math.max(1, Math.round(ITEMS[id].price * (0.7 + 0.02 * (L - 1)))),
  }));
  return { period, buy, sell, next: (period + 1) * STALL_PERIOD };
}
function stallState(farm, now) {
  const period = Math.floor(now / STALL_PERIOD);
  if (!farm.stall || farm.stall.p !== period) farm.stall = { p: period, lv: farm.level, b: {}, s: {} };
  return farm.stall;
}
function stallLeft(farm, now, kind, i, total) {
  const period = Math.floor(now / STALL_PERIOD);
  const used = farm.stall && farm.stall.p === period ? (farm.stall[kind][i] || 0) : 0;
  return total - used;
}

// ---------- zakázky ----------
// deterministický generátor (stejný výsledek na serveru i v prohlížeči)
function rnd(farm) {
  farm.seed = (farm.seed * 16807) % 2147483647;
  return (farm.seed - 1) / 2147483646;
}

// co hráč na své úrovni (a s budovami odemčenými statkem st) umí získat; semena a sazenice ne
function orderableItems(level, st = 99) {
  const out = CROP_LIST.filter(c => c.level <= level).map(c => c.id);
  for (const r of Object.values(RECIPES)) if (PRODUCTS[r.id] && r.level <= level && BUILDINGS[r.building].st <= st) out.push(r.id);
  for (const a of ANIMAL_LIST) if (a.level <= level && BUILDINGS[a.home].st <= st) out.push(a.product);
  for (const t of TREE_LIST) if (t.level <= level) out.push(t.fruit);
  return [...new Set(out)];
}

function genOrder(farm, readyAt) {
  const pool = orderableItems(farm.level, statekLevel(farm));
  const kinds = Math.min(pool.length, 1 + Math.floor(rnd(farm) * Math.min(3, 1 + farm.level / 3)));
  const items = [];
  const left = [...pool];
  for (let k = 0; k < kinds; k++) {
    const id = left.splice(Math.floor(rnd(farm) * left.length), 1)[0];
    const it = ITEMS[id];
    const maxQ = it.price <= 5 ? 6 : it.price <= 15 ? 4 : it.price <= 30 ? 3 : 2;
    items.push({ item: id, qty: 1 + Math.floor(rnd(farm) * maxQ) });
  }
  const value = items.reduce((n, x) => n + ITEMS[x.item].price * x.qty, 0);
  return {
    items,
    coins: Math.round(value * (1.3 + rnd(farm) * 0.4) * orderBonus(farm)) + 2,   // o 30–70 % víc než hodnota zboží
    xp: Math.max(1, Math.round(value / 6)),
    readyAt,
  };
}

const orderReady = (o, now) => now >= o.readyAt;
const canDeliver = (farm, o) => o.items.every(x => have(farm, x.item) >= x.qty);


function findPlot(farm, x, y) {
  return farm.plots.find(p => p.x === x && p.y === y) || null;
}

function findObject(farm, id) {
  return farm.objects.find(o => o.id === id) || null;
}

// objekt, který zabírá políčko x,y
// velikost objektu (velké pole má vlastní)
function objSize(o) {
  const d = BUILDINGS[o.kind];
  return { w: o.w || d.w, h: o.h || d.h };
}

function objectAt(farm, x, y) {
  for (const o of farm.objects) {
    const d = objSize(o);
    if (x >= o.x && x < o.x + d.w && y >= o.y && y < o.y + d.h) return o;
  }
  return null;
}

function countKind(farm, kind) {
  return farm.objects.filter(o => o.kind === kind).length;
}

// je místo volné? (ignoreId = objekt, který se právě přesouvá)
function fits(farm, x, y, w, h, ignoreId = 0) {
  if (!isInt(x) || !isInt(y) || !isInt(w) || !isInt(h)) return false;
  for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) if (!landOwned(farm, xx, yy) || isRoad(xx, yy)) return false;
  for (const p of farm.plots) if (p.x >= x && p.x < x + w && p.y >= y && p.y < y + h) return false;
  for (const o of farm.objects) {
    if (o.id === ignoreId) continue;
    const d = objSize(o);
    if (o.x < x + w && x < o.x + d.w && o.y < y + h && y < o.y + d.h) return false;
  }
  return true;
}

// stav pole: 'empty' | 'growing' | 'ready'; progress 0..1; left = zbývající sekundy
function plotState(plot, now) {
  if (!plot || !plot.crop) return { state: 'empty', progress: 0, left: 0 };
  const c = CROPS[plot.crop];
  const total = c.time * 1000;
  const elapsed = Math.max(0, now - plot.planted);
  if (elapsed >= total) return { state: 'ready', progress: 1, left: 0 };
  return { state: 'growing', progress: elapsed / total, left: Math.ceil((total - elapsed) / 1000) };
}

// fronta výroby: [{ r, start, end, state: 'waiting'|'working'|'done', progress, left }]
function queueState(obj, now) {
  return (obj.queue || []).map(q => {
    const time = q.d || RECIPES[q.r].time * 1000;
    const start = q.end - time;
    if (now >= q.end) return { ...q, state: 'done', progress: 1, left: 0 };
    if (now < start) return { ...q, state: 'waiting', progress: 0, left: Math.ceil((q.end - now) / 1000) };
    return { ...q, state: 'working', progress: (now - start) / time, left: Math.ceil((q.end - now) / 1000) };
  });
}

// stav zvířete: 'hungry' | 'eating' | 'ready'
function animalState(animal, def, now) {
  if (!animal.fed) return { state: 'hungry', progress: 0, left: 0 };
  const total = animal.dur || def.time * 1000;
  const el = now - animal.fed;
  if (el >= total) return { state: 'ready', progress: 1, left: 0 };
  return { state: 'eating', progress: Math.max(0, el / total), left: Math.ceil((total - el) / 1000) };
}

// souhrn pro budovu (pro bubliny nad budovou)
function objectStatus(obj, now, farm) {
  const d = BUILDINGS[obj.kind];
  if (d.type === 'bigfield') {
    const st = fieldState(obj, now).state;
    return { done: st === 'ready' || st === 'unload' ? 1 : 0, busy: st === 'sowing' || st === 'harvesting' };
  }
  if (d.type === 'hive' && farm) return { done: hiveStock(farm, obj, now).count };
  if (d.type === 'orchard') {
    const st = treeState(obj, now).state;
    return { done: st === 'ready' ? 1 : 0, dead: st === 'dead' };
  }
  if (d.type === 'main' && farm) {
    return { done: farm.orders.filter(o => orderReady(o, now) && canDeliver(farm, o)).length };
  }
  if (d.type === 'factory') {
    const q = queueState(obj, now);
    return { done: q.filter(x => x.state === 'done').length, busy: q.some(x => x.state === 'working') };
  }
  if (d.type === 'pen') {
    const a = ANIMALS[d.animal];
    const st = (obj.animals || []).map(x => animalState(x, a, now).state);
    return { done: st.filter(s => s === 'ready').length, hungry: st.filter(s => s === 'hungry').length, busy: st.includes('eating') };
  }
  return {};
}

function fail(code) { return { ok: false, error: code }; }

// ---------- akce ----------
// Aplikuje akci na farmu (mění objekt). Vrací { ok, error?, gained? }.
function applyAction(farm, a, now) {
  normalize(farm);
  ensureQuests(farm, now);
  if (farm.helper) runHelper(farm, now);
  if (!a || typeof a.type !== 'string') return fail('bad_action');
  switch (a.type) {
    case 'plant': {
      const p = findPlot(farm, a.x, a.y);
      if (!p) return fail('no_plot');
      if (p.crop) return fail('not_empty');
      const c = getCrop(a.crop);
      if (!c) return fail('bad_action');
      if (farm.level < c.level) return fail('locked');
      const pay = payCrop(farm, c, 1);
      if (!pay) return fail('no_coins');
      addStat(farm, 'plant', 1);
      p.crop = c.id;
      p.planted = now;
      return { ok: true, seed: pay.seeds > 0 };
    }
    case 'harvest': {
      const p = findPlot(farm, a.x, a.y);
      if (!p || !p.crop) return fail('no_plot');
      if (plotState(p, now).state !== 'ready') return fail('not_ready');
      const c = CROPS[p.crop];
      if (siloFree(farm) < c.yield) return fail('silo_full');
      const qty = harvestPlot(farm, p);
      const levelUp = addXp(farm, c.xp);
      return { ok: true, bonus: qty > c.yield, gained: { items: [{ item: c.id, qty }], xp: c.xp, levelUp } };
    }
    case 'sowAll': {
      if (!hasMachine(farm, 'tractor')) return fail('no_machine');
      const c = getCrop(a.crop);
      if (!c) return fail('bad_action');
      if (farm.level < c.level) return fail('locked');
      const empty = farm.plots.filter(p => !p.crop);
      if (!empty.length) return fail('nothing');
      let n = 0;
      for (const p of empty) {
        if (!payCrop(farm, c, 1)) break;
        p.crop = c.id; p.planted = now; n++;
      }
      if (!n) return fail('no_coins');
      addStat(farm, 'plant', n);
      return { ok: true, count: n };
    }
    case 'harvestAll': {
      if (!hasMachine(farm, 'combine')) return fail('no_machine');
      const ready = farm.plots.filter(p => plotState(p, now).state === 'ready');
      if (!ready.length) return fail('not_ready');
      const items = []; let xp = 0, n = 0;
      for (const p of ready) {
        const c = CROPS[p.crop];
        if (siloFree(farm) < c.yield) break;
        addItem(farm, c.id, c.yield);
        items.push({ item: c.id, qty: c.yield });
        xp += c.xp; n++;
        p.crop = null; p.planted = 0;
      }
      if (!n) return fail('silo_full');
      const levelUp = addXp(farm, xp);
      return { ok: true, count: n, partial: n < ready.length, gained: { items: mergeItems(items), xp, levelUp } };
    }
    case 'buyPlot': {
      if (!fits(farm, a.x, a.y, 1, 1)) return fail(isInt(a.x) && isInt(a.y) && landOwned(farm, a.x, a.y) ? 'occupied' : 'out_of_farm');
      if (farm.plots.length >= maxPlots(farm)) return fail('max_plots');
      const price = plotPrice(farm);
      if (farm.coins < price) return fail('no_coins');
      farm.coins -= price;
      farm.plots.push({ x: a.x, y: a.y, crop: null, planted: 0 });
      return { ok: true };
    }
    case 'sell': {
      const it = getItem(a.item);
      if (!it || !isInt(a.qty) || a.qty <= 0) return fail('bad_action');
      if (have(farm, it.id) < a.qty) return fail('not_enough');
      takeItem(farm, it.id, a.qty);
      const earned = a.qty * sellPrice(it.id, now);
      farm.coins += earned;
      addStat(farm, 'sold', earned);
      return { ok: true };
    }
    case 'place': {
      const d = getBuilding(a.kind);
      if (!d || d.type === 'main') return fail('bad_action');
      const free = farm.pending.includes(d.id);
      let { w, h } = d;
      if (d.type === 'bigfield') {
        w = a.w; h = a.h;
        if (!isInt(w) || !isInt(h) || w < FIELD_MIN || h < FIELD_MIN || w > FIELD_MAX || h > FIELD_MAX) return fail('bad_size');
      }
      const cost = d.type === 'orchard' ? orchardPrice(farm) : d.type === 'bigfield' ? w * h * FIELD_CELL_PRICE : d.cost;
      if (d.town) return fail('town');
      if (!free) {
        if (d.type === 'storage') return fail('max_count');
        if (d.st > statekLevel(farm)) return fail('statek_low');
        if (d.max && countKind(farm, d.id) >= d.max) return fail('max_count');
        if (d.type === 'orchard' && countKind(farm, 'sad') >= maxOrchards(farm)) return fail('max_orchards');
        if (d.type === 'bigfield' && countKind(farm, 'velkepole') >= maxBigFields(farm)) return fail('max_fields');
      }
      if (!fits(farm, a.x, a.y, w, h)) return fail('occupied');
      if (!free && farm.coins < cost) return fail('no_coins');
      if (free) farm.pending.splice(farm.pending.indexOf(d.id), 1);
      else farm.coins -= cost;
      const o = { id: farm.nextId++, kind: d.id, x: a.x, y: a.y };
      if (d.type === 'factory') o.queue = [];
      if (d.type === 'pen') o.animals = [];
      if (d.type !== 'deco' && d.type !== 'orchard' && d.type !== 'bigfield') o.lvl = 1;
      if (d.type === 'orchard') { o.tree = null; o.readyAt = 0; o.left = 0; o.dead = false; }
      if (d.type === 'pond') { o.sc = pondCap(o); o.st = now; o.hook = null; }
      if (d.type === 'hive') { o.sc = 0; o.st = now; }
      if (d.type === 'bigfield') { o.w = w; o.h = h; o.crop = null; o.job = null; o.readyAt = 0; o.load = null; o.soil = 'raw'; o.straw = false; }
      farm.objects.push(o);
      const levelUp = addXp(farm, d.xp);
      return { ok: true, id: o.id, gained: { items: [], xp: d.xp, levelUp } };
    }
    case 'move': {
      const o = findObject(farm, a.id);
      if (!o) return fail('no_object');
      const d = BUILDINGS[o.kind];
      if (d.type === 'main') return fail('fixed');
      const sz = objSize(o);
      if (!fits(farm, a.x, a.y, sz.w, sz.h, o.id)) return fail('occupied');
      o.x = a.x; o.y = a.y;
      return { ok: true };
    }
    case 'produce': {
      const o = findObject(farm, a.id);
      if (!o || BUILDINGS[o.kind].type !== 'factory') return fail('no_object');
      const r = getRecipe(a.recipe);
      if (!r || r.building !== o.kind) return fail('bad_action');
      if (farm.level < r.level) return fail('locked');
      if (o.queue.length >= queueSize(o)) return fail('queue_full');
      if (!hasInputs(farm, r)) return fail('no_inputs');
      for (const [id, n] of Object.entries(r.in)) takeItem(farm, id, n);
      const last = o.queue.length ? o.queue[o.queue.length - 1].end : 0;
      const d = Math.round(r.time * 1000 * speedMult(o));
      o.queue.push({ r: r.id, end: Math.max(now, last) + d, d });
      return { ok: true };
    }
    case 'collect': {
      const o = findObject(farm, a.id);
      if (!o) return fail('no_object');
      const d = BUILDINGS[o.kind];
      const items = [];
      let xp = 0, full = false, anyReady = false;
      if (d.type === 'factory') {
        while (o.queue.length && o.queue[0].end <= now) {
          anyReady = true;
          const n = recipeQty(RECIPES[o.queue[0].r]);
          if (siloFree(farm) < n) { full = true; break; }
          const q = o.queue.shift();
          addItem(farm, q.r, n);
          items.push({ item: q.r, qty: n });
          xp += RECIPES[q.r].xp;
        }
      } else if (d.type === 'pen') {
        const an = ANIMALS[d.animal];
        for (const x of o.animals) {
          if (animalState(x, an, now).state !== 'ready') continue;
          anyReady = true;
          if (siloFree(farm) < 1) { full = true; break; }
          x.fed = 0;
          addItem(farm, an.product, 1);
          items.push({ item: an.product, qty: 1 });
          xp += an.xp;
        }
      } else if (d.type === 'hive') {
        const s = hiveStock(farm, o, now);
        const n = Math.min(s.count, siloFree(farm));
        anyReady = s.count > 0; full = n < s.count;
        if (n > 0) {
          takeStock(o, now, s.cap, hiveIv(farm, o), n);
          addItem(farm, 'plast', n);
          items.push({ item: 'plast', qty: n });
          xp += 2 * n;
        }
      } else return fail('bad_action');
      if (!items.length) return fail(full ? 'silo_full' : anyReady ? 'silo_full' : 'not_ready');
      const levelUp = addXp(farm, xp);
      return { ok: true, gained: { items: mergeItems(items), xp, levelUp }, partial: full };
    }
    case 'feed': {
      const o = findObject(farm, a.id);
      if (!o || BUILDINGS[o.kind].type !== 'pen') return fail('no_object');
      const an = ANIMALS[BUILDINGS[o.kind].animal];
      const hungry = o.animals.filter(x => !x.fed);
      if (!hungry.length) return fail('nothing');
      let fed = 0;
      for (const x of hungry) {
        if (have(farm, an.feed) < 1) break;
        takeItem(farm, an.feed, 1);
        x.fed = now;
        x.dur = Math.round(an.time * 1000 * speedMult(o));
        fed++;
      }
      if (!fed) return fail('no_feed');
      addStat(farm, 'feed', fed);
      return { ok: true, fed };
    }
    case 'buyAnimal': {
      const an = own(ANIMALS, a.animal);
      if (!an) return fail('bad_action');
      if (farm.level < an.level) return fail('locked');
      const home = farm.objects.find(o => o.kind === an.home && o.animals.length < penMax(o));
      if (!home) return fail(countKind(farm, an.home) ? 'pen_full' : 'no_home');
      if (farm.coins < an.cost) return fail('no_coins');
      farm.coins -= an.cost;
      home.animals.push({ fed: 0 });
      return { ok: true, id: home.id };
    }
    case 'upgradeSilo': {
      const price = siloUpgradePrice(farm);
      if (farm.coins < price) return fail('no_coins');
      farm.coins -= price;
      farm.siloCap += SILO_STEP;
      return { ok: true };
    }
    case 'plantTree': {
      const o = findObject(farm, a.id);
      if (!o || BUILDINGS[o.kind].type !== 'orchard') return fail('no_object');
      if (o.tree) return fail('not_empty_tree');
      const t = own(TREES, a.tree);
      if (!t) return fail('bad_action');
      if (farm.level < t.level) return fail('locked');
      const sap = have(farm, 'z_' + t.id) > 0;
      if (!sap && farm.coins < t.cost) return fail('no_coins');
      if (sap) takeItem(farm, 'z_' + t.id, 1); else farm.coins -= t.cost;
      o.tree = t.id; o.left = t.harvests; o.dead = false; o.readyAt = now + t.first * 1000;
      return { ok: true, sapling: sap };
    }
    case 'harvestTree': {
      const o = findObject(farm, a.id);
      if (!o || BUILDINGS[o.kind].type !== 'orchard') return fail('no_object');
      if (treeState(o, now).state !== 'ready') return fail('not_ready');
      const t = TREES[o.tree];
      const qty = t.yield + beeBonus(farm, o);
      if (siloFree(farm) < qty) return fail('silo_full');
      addItem(farm, t.fruit, qty);
      const levelUp = addXp(farm, t.xp);
      o.left--;
      if (o.left > 0) o.readyAt = now + t.regrow * 1000; else o.dead = true;
      return { ok: true, bees: qty > t.yield, gained: { items: [{ item: t.fruit, qty }], xp: t.xp, levelUp }, dead: o.dead };
    }
    case 'clearTree': {
      const o = findObject(farm, a.id);
      if (!o || BUILDINGS[o.kind].type !== 'orchard' || !o.tree) return fail('no_object');
      if (!o.dead) return fail('not_ready');
      o.tree = null; o.dead = false; o.readyAt = 0; o.left = 0;
      return { ok: true };
    }
    case 'buyMachine': {
      const m = own(MACHINES, a.model);
      if (!m) return fail('bad_action');
      if (farm.level < m.level) return fail('locked');
      if (farm.machines.some(x => x.model === m.id)) return fail('owned');
      if (isVehicle(m.id) && vehicleCount(farm) >= garageSlots(farm)) return fail(countKind(farm, 'stodola') ? 'garage_full' : 'no_garage');
      const price = machinePrice(farm, m.id);
      if (farm.coins < price) return fail('no_coins');
      farm.coins -= price;
      const id = farm.nextId++;
      farm.machines.push({ id, model: m.id });
      const levelUp = addXp(farm, 5);
      return { ok: true, id, gained: { items: [], xp: 5, levelUp } };
    }
    case 'fieldSow': {
      const o = findObject(farm, a.id);
      if (!o || BUILDINGS[o.kind].type !== 'bigfield') return fail('no_object');
      if (fieldState(o, now).state !== 'empty') return fail('not_empty');
      const c = getCrop(a.crop);
      if (!c) return fail('bad_action');
      if (farm.level < c.level) return fail('locked');
      const m = findMachine(farm, a.machine);
      if (!m || MACHINES[m.model].type !== 'tractor') return fail('no_machine');
      if (machineJob(farm, m.id, now)) return fail('machine_busy');
      const cells = o.w * o.h;
      const pay = payCrop(farm, c, cells);
      if (!pay) return fail('no_coins');
      addStat(farm, 'plant', cells);
      const sec = Math.ceil(jobSeconds(cells, m.model) / (hasTool(farm, 'seeder') ? 2 : 1));
      o.mult = o.soil === 'plowed' ? 1.5 : 1;
      o.soil = 'sown'; o.straw = false;
      o.crop = c.id;
      o.job = { type: 'sow', m: m.id, start: now, end: now + sec * 1000 };
      o.readyAt = o.job.end + c.time * 1000;
      o.load = null;
      addStat(farm, 'jobs', 1);
      return { ok: true };
    }
    case 'fieldHarvest': {
      const o = findObject(farm, a.id);
      if (!o || BUILDINGS[o.kind].type !== 'bigfield') return fail('no_object');
      if (fieldState(o, now).state !== 'ready') return fail('not_ready');
      const m = findMachine(farm, a.machine);
      if (!m) return fail('no_machine');
      if (MACHINES[m.model].type !== CROPS[o.crop].harvester) return fail('wrong_machine');
      if (machineJob(farm, m.id, now)) return fail('machine_busy');
      o.job = { type: 'harvest', m: m.id, start: now, end: now + jobSeconds(o.w * o.h, m.model) * 1000 };
      o.load = { item: o.crop, qty: fieldYield(o), xp: CROPS[o.crop].xp * o.w * o.h };
      o.straw = CROPS[o.crop].harvester === 'combine';
      o.crop = null; o.readyAt = 0; o.soil = 'stubble';
      addStat(farm, 'jobs', 1);
      return { ok: true };
    }
    case 'fieldPlow':
    case 'fieldBale': {
      const o = findObject(farm, a.id);
      if (!o || BUILDINGS[o.kind].type !== 'bigfield') return fail('no_object');
      const st = fieldState(o, now);
      if (st.state !== 'empty') return fail('not_empty');
      const plow = a.type === 'fieldPlow';
      if (!hasTool(farm, plow ? 'plow' : 'baler')) return fail('no_machine');
      if (plow && o.soil === 'plowed') return fail('nothing');
      if (!plow && !o.straw) return fail('nothing');
      const m = findMachine(farm, a.machine);
      if (!m || MACHINES[m.model].type !== 'tractor') return fail('no_machine');
      if (machineJob(farm, m.id, now)) return fail('machine_busy');
      o.job = { type: plow ? 'plow' : 'bale', m: m.id, start: now, end: now + jobSeconds(o.w * o.h, m.model) * 1000 };
      if (plow) { o.soil = 'plowed'; o.straw = false; }
      else { o.straw = false; o.load = { item: 'slama', qty: Math.floor(o.w * o.h / 2), xp: 0 }; }
      addStat(farm, 'jobs', 1);
      return { ok: true };
    }
    case 'fieldUnload': {
      const o = findObject(farm, a.id);
      if (!o || BUILDINGS[o.kind].type !== 'bigfield') return fail('no_object');
      const st = fieldState(o, now);
      if (st.state !== 'unload') return fail('not_ready');
      const n = Math.min(st.stock, siloFree(farm));
      if (n <= 0) return fail('silo_full');
      addItem(farm, o.load.item, n);
      const xp = o.load.xp || 0;
      o.load.xp = 0;
      o.load.qty -= n;
      const levelUp = xp ? addXp(farm, xp) : 0;
      const rest = o.load.qty;
      const item = o.load.item;
      if (!rest) o.load = null;
      return { ok: true, rest, gained: { items: [{ item, qty: n }], xp, levelUp } };
    }
    case 'upgrade': {
      const o = a.town !== undefined ? (TOWN_KINDS.includes(a.town) && BUILDINGS[a.town].type !== 'market' ? townObject(farm, a.town) : null) : findObject(farm, a.id);
      if (!o) return fail('no_object');
      const c = upgradeCost(o);
      if (!c) return fail(UP_BASE[BUILDINGS[o.kind].type] ? 'max_level' : 'bad_action');
      if (BUILDINGS[o.kind].type !== 'main' && c.level > statekLevel(farm)) return fail('statek_low');
      if (c.items.some(x => have(farm, x.item) < x.qty)) return fail('no_inputs');
      if (farm.coins < c.coins) return fail('no_coins');
      for (const x of c.items) takeItem(farm, x.item, x.qty);
      farm.coins -= c.coins;
      if (o.town) farm.town[o.kind] = c.level; else o.lvl = c.level;
      if (BUILDINGS[o.kind].type === 'storage') farm.siloCap += 40;
      const levelUp = addXp(farm, 5 * c.level);
      return { ok: true, level: c.level, gained: { items: [], xp: 5 * c.level, levelUp } };
    }
    case 'sellMachine': {
      const m = findMachine(farm, a.id);
      if (!m) return fail('no_machine');
      if (machineJob(farm, m.id, now)) return fail('machine_busy');
      const refund = Math.round(MACHINES[m.model].cost * 0.5);
      farm.machines = farm.machines.filter(x => x.id !== m.id);
      farm.coins += refund;
      return { ok: true, refund };
    }
    case 'stallBuy':
    case 'stallSell': {
      const offers = stallOffers(farm, now);
      const buy = a.type === 'stallBuy';
      const list = buy ? offers.buy : offers.sell;
      const off = isInt(a.i) ? list[a.i] : null;
      if (!off || !isInt(a.qty) || a.qty <= 0) return fail('bad_action');
      const st = stallState(farm, now);
      const key = buy ? 'b' : 's';
      if ((st[key][a.i] || 0) + a.qty > off.qty) return fail('stall_qty');
      const total = off.price * a.qty;
      if (buy) {
        if (farm.coins < total) return fail('no_coins');
        if (siloFree(farm) < a.qty) return fail('silo_full');
        farm.coins -= total;
        farm.silo[off.item] = (farm.silo[off.item] || 0) + a.qty;
      } else {
        if (have(farm, off.item) < a.qty) return fail('not_enough');
        takeItem(farm, off.item, a.qty);
        farm.coins += total;
        addStat(farm, 'sold', total);
      }
      st[key][a.i] = (st[key][a.i] || 0) + a.qty;
      return { ok: true, total };
    }
    case 'hire': {
      const plan = isInt(a.plan) ? HELPER_PLANS[a.plan] : null;
      if (!plan) return fail('bad_action');
      if (farm.level < HELPER_LEVEL) return fail('helper_level');
      if (a.crop !== null && a.crop !== undefined && !getCrop(a.crop)) return fail('bad_action');
      if (farm.coins < plan.cost) return fail('no_coins');
      farm.coins -= plan.cost;
      if (helperActive(farm, now)) farm.helper.until += plan.h * 3600000;
      else farm.helper = { until: now + plan.h * 3600000, last: now, crop: a.crop || null, tractor: !!(farm.helper && farm.helper.tractor), n: 0 };
      if (a.crop) farm.helper.crop = a.crop;
      return { ok: true };
    }
    case 'helperSet': {
      if (!farm.helper) return fail('no_helper');
      if (a.crop !== undefined) {
        if (a.crop !== null && !getCrop(a.crop)) return fail('bad_action');
        farm.helper.crop = a.crop;
      }
      if (a.tractor !== undefined) farm.helper.tractor = !!a.tractor;
      return { ok: true };
    }
    case 'buyLand': {
      const p = getParcel(a.id);
      if (!p) return fail('bad_action');
      if (farm.land.includes(p.id)) return fail('land_owned');
      if (!landReachable(farm, p)) return fail('land_far');
      if (farm.level < landLevel(farm)) return fail('locked');
      const price = landPrice(farm);
      if (farm.coins < price) return fail('no_coins');
      farm.coins -= price;
      farm.land.push(p.id);
      const levelUp = addXp(farm, 20);
      return { ok: true, price, gained: { items: [], xp: 20, levelUp } };
    }
    case 'claimDaily': {
      const today = dayKey(now);
      if (farm.daily.day === today) return fail('claimed');
      const yesterday = dayKey(now - 86400000);
      const streak = farm.daily.day === yesterday ? farm.daily.streak % 7 + 1 : 1;
      const r = DAILY[streak - 1];
      farm.daily = { day: today, streak };
      farm.coins += r.coins;
      const levelUp = r.xp ? addXp(farm, r.xp) : 0;
      return { ok: true, streak, coins: r.coins, gained: { items: [], xp: r.xp || 0, levelUp } };
    }
    case 'fishCast': {
      const o = findObject(farm, a.id);
      if (!o || BUILDINGS[o.kind].type !== 'pond') return fail('no_object');
      if (!hasTool(farm, 'rod')) return fail('no_rod');
      if (farm.level < FISH_LIST[0].level) return fail('locked');
      if (o.hook && now - o.hook.t < HOOK_MS) return fail('hooked');
      const s = pondStock(o, now);
      if (s.count < 1) return fail('no_fish');
      if (have(farm, 'navnada') < 1) return fail('no_bait');
      takeItem(farm, 'navnada', 1);
      takeStock(o, now, s.cap, pondIv(o), 1);
      o.hook = { f: pickFish(farm, rnd(farm)), t: now };
      return { ok: true, fish: o.hook.f };
    }
    case 'fishLand': {
      const o = findObject(farm, a.id);
      if (!o || BUILDINGS[o.kind].type !== 'pond') return fail('no_object');
      if (!o.hook || now - o.hook.t > HOOK_MS + 30000) { o.hook = null; return fail('no_hook'); }
      const f = FISH[o.hook.f];
      if (a.ok !== true) { o.hook = null; return { ok: true, lost: true, fish: f.id }; }
      if (siloFree(farm) < 1) return fail('silo_full');
      o.hook = null;
      addItem(farm, f.id, 1);
      const levelUp = addXp(farm, f.xp);
      return { ok: true, fish: f.id, gained: { items: [{ item: f.id, qty: 1 }], xp: f.xp, levelUp } };
    }
    case 'tutorial': {
      if (!isInt(a.n) || a.n < 0 || a.n > TUTORIAL_DONE) return fail('bad_action');
      farm.tut = a.reset ? a.n : Math.max(farm.tut || 0, a.n);
      return { ok: true };
    }
    case 'claimQuest': {
      const qs = farm.quests;
      if (a.i === 'bonus') {
        if (qs.bonus) return fail('quest_done');
        if (!qs.list.every(q => q.done)) return fail('not_ready');
        const b = questBonus(farm);
        qs.bonus = true;
        farm.coins += b.coins;
        const levelUp = addXp(farm, b.xp);
        return { ok: true, coins: b.coins, gained: { items: [], xp: b.xp, levelUp } };
      }
      const q = isInt(a.i) ? qs.list[a.i] : null;
      if (!q) return fail('bad_action');
      if (q.done) return fail('quest_done');
      if (questProgress(farm, qs, q) < q.n) return fail('not_ready');
      q.done = true;
      farm.coins += q.coins;
      const levelUp = addXp(farm, q.xp);
      return { ok: true, coins: q.coins, gained: { items: [], xp: q.xp, levelUp } };
    }
    case 'claimAch': {
      const ach = ACHIEVEMENTS.find(x => x.id === a.id);
      if (!ach) return fail('bad_action');
      const tier = farm.ach[ach.id] || 0;
      if (tier >= ach.tiers.length) return fail('nothing');
      if ((farm.stats[ach.stat] || 0) < ach.tiers[tier]) return fail('not_ready');
      farm.ach[ach.id] = tier + 1;
      farm.coins += ach.coins[tier];
      return { ok: true, coins: ach.coins[tier], tier: tier + 1 };
    }
    case 'deliver': {
      const o = isInt(a.slot) ? farm.orders[a.slot] : null;
      if (!o || !orderReady(o, now)) return fail('no_order');
      if (!canDeliver(farm, o)) return fail('missing');
      for (const x of o.items) takeItem(farm, x.item, x.qty);
      farm.coins += o.coins;
      addStat(farm, 'orders', 1);
      const levelUp = addXp(farm, o.xp);
      const coins = o.coins, xp = o.xp;
      farm.orders[a.slot] = genOrder(farm, now);
      return { ok: true, coins, gained: { items: [], xp, levelUp } };
    }
    case 'discard': {
      const o = isInt(a.slot) ? farm.orders[a.slot] : null;
      if (!o || !orderReady(o, now)) return fail('no_order');
      farm.orders[a.slot] = genOrder(farm, now + ORDER_WAIT * 1000);
      return { ok: true };
    }
    default:
      return fail('bad_action');
  }
}

function mergeItems(list) {
  const m = {};
  for (const { item, qty } of list) m[item] = (m[item] || 0) + qty;
  return Object.entries(m).map(([item, qty]) => ({ item, qty }));
}

// v10: semena (balíček s obrázkem plodiny) a sazenice (stromek v květináči s plodem)
const inner = svg => svg.replace(/^<svg[^>]*>/, '').replace(/<\/svg>$/, '');
const packet = key => S(`<path d="M6 7h20l-1.5 22h-17z" fill="#f3e3c3" stroke="#a0763f" stroke-width="1.4"/><path d="M6 7l2-4h16l2 4z" fill="#d9c4a0" stroke="#a0763f" stroke-width="1.2"/><g transform="translate(8.5 8.5) scale(.47)">${inner(ICONS[key])}</g><path d="M9.5 26h13" stroke="#c8452d" stroke-width="2"/>`);
for (const k of ['wheat', 'corn', 'soy', 'repka', 'sun', 'hrach', 'redkvicka', 'salat', 'carrot', 'rajce', 'potato', 'okurka', 'cibule', 'cesnek', 'paprika', 'beet', 'zeli', 'dyne', 'jahody', 'meloun']) ICONS['s_' + k] = packet(k);
const sapling = fruit => S(`<path d="M9 21h14l-2 9H11z" fill="#c8662d"/><rect x="8" y="19" width="16" height="3" rx="1" fill="#a8542a"/><path d="M16 20V8" stroke="#7a4e2a" stroke-width="2"/><ellipse cx="11.5" cy="12" rx="4" ry="2.2" fill="#5fae3a" transform="rotate(-25 11.5 12)"/><ellipse cx="20.5" cy="10" rx="4" ry="2.2" fill="#4f9a3a" transform="rotate(25 20.5 10)"/><g transform="translate(17 0) scale(.42)">${inner(ICONS[fruit])}</g>`);
for (const [t, f] of Object.entries({ maliny: 'maliny', rybiz: 'rybiz', angrest: 'angrest', boruvky: 'boruvky', reva: 'hrozny', jablon: 'jablko', hrusen: 'hruska', svestka: 'svestka', tresen: 'tresne', visen: 'visne', merunka: 'merunka', broskev: 'broskev', orech: 'orech' })) ICONS['z_' + t] = sapling(f);

const urlCache = {};
function iconUrl(key) {
  if (!ICONS[key]) return '';
  return urlCache[key] || (urlCache[key] = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(ICONS[key]));
}

function ic(key, cls = '') {
  return ICONS[key] ? `<img class="ic${cls ? ' ' + cls : ''}" src="${iconUrl(key)}" alt="">` : '';
}

// „Mám 5 :coin:“ → text s obrázky
function iconize(html) {
  return String(html).replace(/:([a-z_0-9]+):/g, (m, k) => (ICONS[k] ? ic(k) : m));
}

// ---------- canvas ----------
const imgCache = {};
function iconImage(key) {
  if (!ICONS[key]) return null;
  if (!imgCache[key]) {
    const im = new Image();
    im.src = iconUrl(key);
    imgCache[key] = im;
  }
  return imgCache[key].complete && imgCache[key].naturalWidth ? imgCache[key] : null;
}

function drawIcon(ctx, key, x, y, size) {
  const im = iconImage(key);
  if (im) ctx.drawImage(im, x - size / 2, y - size / 2, size, size);
}

// text s :ikonami: vycentrovaný na x
function drawIconText(ctx, text, x, y, size, stroke) {
  const parts = String(text).split(/:([a-z_0-9]+):/);
  const widths = parts.map((p, i) => (i % 2 ? size : ctx.measureText(p).width));
  let cx = x - widths.reduce((a, b) => a + b, 0) / 2;
  ctx.textAlign = 'left';
  parts.forEach((p, i) => {
    if (i % 2) drawIcon(ctx, p, cx + size / 2, y - size * 0.35, size);
    else if (p) {
      if (stroke) ctx.strokeText(p, cx, y);
      ctx.fillText(p, cx, y);
    }
    cx += widths[i];
  });
}

// ---- public/js/sfx.js ----
// EKOfarm – zvuky skládané přímo v prohlížeči (WebAudio), žádné zvukové soubory ani cizí licence.

let actx = null;
let on = true;
try { on = localStorage.getItem('ekofarm_sound') !== 'off'; } catch { /* bez úložiště */ }

const soundOn = () => on;
function setSound(v) {
  on = v;
  try { localStorage.setItem('ekofarm_sound', v ? 'on' : 'off'); } catch { /* nevadí */ }
}

function audio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC();
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
// zvuk smí začít až po dotyku – odemknout při prvním klepnutí
window.addEventListener('pointerdown', () => { if (on) audio(); }, { once: true });

// jeden tón: f = Hz, t = začátek (s), d = délka (s)
function tone(c, f, t, d, type = 'sine', vol = 0.18, slide = 0) {
  const o = c.createOscillator(), g = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, c.currentTime + t);
  if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, c.currentTime + t + d);
  g.gain.setValueAtTime(0.0001, c.currentTime + t);
  g.gain.exponentialRampToValueAtTime(vol, c.currentTime + t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + t + d);
  o.connect(g).connect(c.destination);
  o.start(c.currentTime + t);
  o.stop(c.currentTime + t + d + 0.02);
}

const SOUNDS = {
  tap: c => tone(c, 660, 0, 0.05, 'triangle', 0.08),
  plant: c => tone(c, 300, 0, 0.08, 'triangle', 0.1, 0.7),
  harvest: c => { tone(c, 520, 0, 0.07, 'triangle', 0.14); tone(c, 780, 0.05, 0.08, 'triangle', 0.12); },
  coin: c => { tone(c, 988, 0, 0.07, 'square', 0.06); tone(c, 1319, 0.07, 0.18, 'square', 0.06); },
  build: c => { tone(c, 180, 0, 0.09, 'square', 0.08); tone(c, 140, 0.1, 0.12, 'square', 0.08); },
  level: c => [523, 659, 784, 1047].forEach((f, i) => tone(c, f, i * 0.11, 0.22, 'triangle', 0.14)),
  error: c => tone(c, 200, 0, 0.16, 'sawtooth', 0.06, 0.8),
  engine: c => tone(c, 90, 0, 0.5, 'sawtooth', 0.05, 1.3),
};

let last = {};
function sfx(name) {
  if (!on || !SOUNDS[name]) return;
  const c = audio();
  if (!c) return;
  const now = performance.now();
  if (now - (last[name] || 0) < 45) return;   // při tažení přes pole nehrát 20 zvuků naráz
  last[name] = now;
  try { SOUNDS[name](c); } catch { /* zvuk není důležitý */ }
}

// ---- public/js/render.js ----
// EKOfarm – izometrické vykreslování farmy na canvas.




const TW = 96;   // šířka dlaždice
const TH = 48;   // výška dlaždice

// střed dlaždice v izometrických souřadnicích
function cellCenter(gx, gy) {
  return [(gx - gy) * TW / 2, (gx + gy + 1) * TH / 2];
}

function screenToCell(sx, sy, cam, W, H) {
  const ix = (sx - W / 2) / cam.zoom + cam.x;
  const iy = (sy - H / 2) / cam.zoom + cam.y;
  const a = ix / (TW / 2), b = iy / (TH / 2);
  return [Math.floor((b + a) / 2), Math.floor((b - a) / 2)];
}

function cellToScreen(gx, gy, cam, W, H) {
  const [ix, iy] = cellCenter(gx, gy);
  return [(ix - cam.x) * cam.zoom + W / 2, (iy - cam.y) * cam.zoom + H / 2];
}

function inFarm(gx, gy) {
  return gx >= 0 && gy >= 0 && gx < GRID_W && gy < GRID_H;
}

// stromy kolem farmy a v divočině nekoupených pozemků (deterministické); na koupené zemi se nekreslí
const BG_TREES = (() => {
  const out = [];
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const nearTown = (x, y) => (x >= GRID_W - 1 && y >= GRID_H - 1 && Math.abs(x - y) <= 2) || townAt(x, y) || townAt(x - 1, y) || townAt(x, y - 1) || townHouseAt(x, y) || isPlaza(x - 1, y - 1) || isPlaza(x + 1, y + 1);
  for (let gy = WORLD.y0 - 6; gy < TOWN.y1 + 4; gy++) {
    for (let gx = WORLD.x0 - 6; gx < TOWN.x1 + 4; gx++) {
      if (gx >= 0 && gy >= 0 && gx < GRID_W && gy < GRID_H) continue;
      const inWorld = gx >= WORLD.x0 && gy >= WORLD.y0 && gx < WORLD.x1 && gy < WORLD.y1;
      const inTown = gx >= TOWN.x0 && gy >= TOWN.y0;
      const r = rnd(), s = 0.8 + rnd() * 0.5, h = rnd();
      if (nearTown(gx, gy)) continue;
      if (r < (inTown ? 0.07 : inWorld ? 0.16 : 0.35)) out.push({ gx, gy, s, h });
    }
  }
  return out;
})();

function diamond(ctx, cx, cy, w, h) {
  ctx.beginPath();
  ctx.moveTo(cx, cy - h / 2);
  ctx.lineTo(cx + w / 2, cy);
  ctx.lineTo(cx, cy + h / 2);
  ctx.lineTo(cx - w / 2, cy);
  ctx.closePath();
}

function drawTree(ctx, t) {
  const [x, y] = cellCenter(t.gx, t.gy);
  const s = t.s;
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.ellipse(x, y, 22 * s, 10 * s, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#7a4e2a';
  ctx.fillRect(x - 3 * s, y - 22 * s, 6 * s, 22 * s);
  const g = t.h < 0.5 ? ['#3f8f3a', '#4ea845', '#63bd55'] : ['#2f7a3c', '#3d9150', '#52a862'];
  ctx.fillStyle = g[0]; ctx.beginPath(); ctx.arc(x, y - 34 * s, 20 * s, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = g[1]; ctx.beginPath(); ctx.arc(x - 6 * s, y - 40 * s, 14 * s, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = g[2]; ctx.beginPath(); ctx.arc(x - 9 * s, y - 45 * s, 7 * s, 0, Math.PI * 2); ctx.fill();
}

// plot kolem vlastní země – jen na hranách, kde vlastní políčko sousedí s cizím
function drawFence(ctx, farm) {
  const corner = (gx, gy) => [(gx - gy) * TW / 2, (gx + gy) * TH / 2];
  ctx.strokeStyle = '#9b6b3c';
  ctx.lineWidth = 3;
  ctx.fillStyle = '#7d532c';
  for (let gy = WORLD.y0; gy < WORLD.y1; gy++) {
    for (let gx = WORLD.x0; gx < WORLD.x1; gx++) {
      if (!landOwned(farm, gx, gy)) continue;
      const edges = [];
      if (!landOwned(farm, gx, gy - 1)) edges.push([corner(gx, gy), corner(gx + 1, gy)]);
      if (!landOwned(farm, gx + 1, gy)) edges.push([corner(gx + 1, gy), corner(gx + 1, gy + 1)]);
      if (!landOwned(farm, gx, gy + 1)) edges.push([corner(gx, gy + 1), corner(gx + 1, gy + 1)]);
      if (!landOwned(farm, gx - 1, gy)) edges.push([corner(gx, gy), corner(gx, gy + 1)]);
      for (const [a, b] of edges) {
        for (const off of [6, 12]) { ctx.beginPath(); ctx.moveTo(a[0], a[1] - off); ctx.lineTo(b[0], b[1] - off); ctx.stroke(); }
        ctx.fillRect(a[0] - 2, a[1] - 16, 4, 16);
        ctx.fillRect(b[0] - 2, b[1] - 16, 4, 16);
      }
    }
  }
}

// jmenovka budovy v městečku
const TOWN_NAMES = { prodejna: 'Prodejna strojů', stanek: 'Stánek', trziste: 'Tržiště' };
function townLabel(ctx, o) {
  const [x, y] = cellCenter(o.x + 1, o.y + 1);
  ctx.font = '800 15px system-ui, sans-serif';
  const text = TOWN_NAMES[o.kind];
  const w = ctx.measureText(text).width + 22;
  ctx.fillStyle = 'rgba(74,50,24,0.85)';
  roundRect(ctx, x - w / 2, y + 30, w, 24, 12); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  ctx.fillText(text, x, y + 47);
}

// cedule „Na prodej“ uprostřed nekoupeného pozemku
function drawSaleSign(ctx, farm, p) {
  const [x, y] = cellCenter(p.x + p.w / 2 - 0.5, p.y + p.h / 2 - 0.5);
  ctx.fillStyle = '#7a4e2a';
  ctx.fillRect(x - 2.5, y - 44, 5, 44);
  ctx.fillStyle = '#f3e3c3'; ctx.strokeStyle = '#8a5a35'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.rect(x - 46, y - 78, 92, 38); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#4a3218'; ctx.textAlign = 'center';
  ctx.font = '700 12px system-ui, sans-serif';
  ctx.fillText('NA PRODEJ', x, y - 63);
  ctx.font = '700 13px system-ui, sans-serif';
  if (farm.level < landLevel(farm)) {
    drawIcon(ctx, 'lock', x - 30, y - 50, 14);
    ctx.fillText(`úroveň ${landLevel(farm)}`, x + 6, y - 46);
  } else {
    drawIconText(ctx, `${landPrice(farm)} :coin:`, x, y - 46, 15);
  }
}

function drawPlot(ctx, gx, gy, planted) {
  const [x, y] = cellCenter(gx, gy);
  const w = TW - 8, h = TH - 4, d = 5;
  // boky
  ctx.fillStyle = '#5c3a1c';
  ctx.beginPath();
  ctx.moveTo(x - w / 2, y); ctx.lineTo(x, y + h / 2); ctx.lineTo(x + w / 2, y);
  ctx.lineTo(x + w / 2, y + d); ctx.lineTo(x, y + h / 2 + d); ctx.lineTo(x - w / 2, y + d);
  ctx.closePath(); ctx.fill();
  diamond(ctx, x, y, w, h);
  ctx.fillStyle = planted ? '#6f4524' : '#8e5d33';
  ctx.fill();
  // brázdy
  ctx.strokeStyle = planted ? 'rgba(40,20,5,0.35)' : 'rgba(60,30,10,0.3)';
  ctx.lineWidth = 2;
  for (let k = 1; k <= 3; k++) {
    const u = k / 4;
    ctx.beginPath();
    ctx.moveTo(x - w / 2 + u * w / 2, y - u * h / 2 + 2);
    ctx.lineTo(x + u * w / 2, y + h / 2 - u * h / 2 - 2);
    ctx.stroke();
  }
}

function drawPlant(ctx, crop, px, py, g, ready, t) {
  const sway = ready ? Math.sin(t / 400 + px * 0.13) * 1.6 : 0;
  if (g < 0.2) {
    ctx.fillStyle = '#7cc04f';
    ctx.beginPath(); ctx.ellipse(px - 2, py - 3, 2.5, 1.5, -0.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(px + 2, py - 3, 2.5, 1.5, 0.6, 0, Math.PI * 2); ctx.fill();
    return;
  }
  const s = Math.min(1, 0.35 + g * 0.65);
  switch (crop) {
    case 'wheat': {
      const h = 18 * s;
      ctx.strokeStyle = ready ? '#c9a53a' : '#79b84a';
      ctx.lineWidth = 1.6;
      for (const dx of [-3, 0, 3]) {
        ctx.beginPath(); ctx.moveTo(px + dx, py); ctx.lineTo(px + dx * 1.3 + sway, py - h); ctx.stroke();
