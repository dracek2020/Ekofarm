        ctx.fillStyle = ready ? '#f0cf55' : '#9ccc5c';
        ctx.beginPath(); ctx.ellipse(px + dx * 1.3 + sway, py - h - 3, 1.8, 4, 0, 0, Math.PI * 2); ctx.fill();
      }
      break;
    }
    case 'corn': {
      const h = 26 * s;
      ctx.strokeStyle = '#4f9a3a'; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + sway, py - h); ctx.stroke();
      ctx.strokeStyle = '#66b04a'; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.moveTo(px, py - h * 0.4); ctx.quadraticCurveTo(px - 8, py - h * 0.6, px - 10, py - h * 0.35); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px, py - h * 0.6); ctx.quadraticCurveTo(px + 8, py - h * 0.8, px + 10, py - h * 0.55); ctx.stroke();
      if (ready) {
        ctx.fillStyle = '#f6c63d';
        ctx.beginPath(); ctx.ellipse(px + 3 + sway, py - h * 0.55, 2.6, 5.5, 0.3, 0, Math.PI * 2); ctx.fill();
      }
      break;
    }
    case 'carrot': {
      const h = 12 * s;
      if (ready) {
        ctx.fillStyle = '#f07f2a';
        ctx.beginPath(); ctx.ellipse(px, py - 1, 3.2, 2.2, 0, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = '#4fa63c';
      for (const a of [-0.5, 0, 0.5]) {
        ctx.beginPath(); ctx.ellipse(px + Math.sin(a) * 4 + sway, py - h / 2 - 1, 1.8, h / 2, a, 0, Math.PI * 2); ctx.fill();
      }
      break;
    }
    case 'soy': {
      const r = 7 * s;
      ctx.fillStyle = '#4c8f37';
      ctx.beginPath(); ctx.arc(px + sway, py - r, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#69ab4b';
      ctx.beginPath(); ctx.arc(px - 2 + sway, py - r - 2, r * 0.6, 0, Math.PI * 2); ctx.fill();
      if (ready) {
        ctx.fillStyle = '#d9d27a';
        for (const [dx, dy] of [[-3, -4], [3, -7], [1, -2]]) {
          ctx.beginPath(); ctx.ellipse(px + dx + sway, py + dy - r * 0.4, 1.4, 3, 0.4, 0, Math.PI * 2); ctx.fill();
        }
      }
      break;
    }
    case 'potato': {
      const r = 6 * s;
      if (ready) {
        ctx.fillStyle = '#c99a5b';
        ctx.beginPath(); ctx.ellipse(px - 4, py, 3, 2, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(px + 3, py + 1, 2.6, 1.8, 0, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = ready ? '#7a9a3a' : '#4f9a3a';
      ctx.beginPath(); ctx.arc(px + sway, py - r, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e8e2f0';
      if (ready) for (const [dx, dy] of [[-3, -8], [3, -6]]) { ctx.beginPath(); ctx.arc(px + dx + sway, py + dy, 1.4, 0, Math.PI * 2); ctx.fill(); }
      break;
    }
    case 'repka': {
      const h = 16 * s;
      ctx.strokeStyle = '#4f8f37'; ctx.lineWidth = 1.6;
      for (const dx of [-3, 0, 3]) { ctx.beginPath(); ctx.moveTo(px + dx, py); ctx.lineTo(px + dx + sway, py - h); ctx.stroke(); }
      ctx.fillStyle = ready ? '#8a7a3a' : g > 0.5 ? '#f5d63a' : '#9ccc5c';
      for (const dx of [-3, 0, 3]) { ctx.beginPath(); ctx.arc(px + dx + sway, py - h - 2, 2.6, 0, Math.PI * 2); ctx.fill(); }
      break;
    }
    case 'sun': {
      const h = 26 * s;
      ctx.strokeStyle = '#4f8f37'; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + sway, py - h); ctx.stroke();
      ctx.fillStyle = '#5fae3a';
      ctx.beginPath(); ctx.ellipse(px - 4, py - h * 0.45, 4, 2, -0.5, 0, Math.PI * 2); ctx.fill();
      if (g > 0.55) {
        ctx.fillStyle = ready ? '#e6a817' : '#f5c22e';
        ctx.beginPath(); ctx.arc(px + sway, py - h, 5.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#6b4a25';
        ctx.beginPath(); ctx.arc(px + sway, py - h, 2.6, 0, Math.PI * 2); ctx.fill();
      }
      break;
    }
    case 'beet': {
      const h = 11 * s;
      if (ready) { ctx.fillStyle = '#efe3c8'; ctx.beginPath(); ctx.ellipse(px, py - 1, 3.4, 2.4, 0, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = '#3f8f3a';
      for (const a of [-0.7, -0.2, 0.3, 0.8]) {
        ctx.beginPath(); ctx.ellipse(px + Math.sin(a) * 5 + sway, py - h / 2 - 1, 2.6, h / 2, a, 0, Math.PI * 2); ctx.fill();
      }
      break;
    }
    default: drawLook(ctx, (CROPS[crop] && CROPS[crop].look) || {}, px, py, g, s, ready, sway);
  }
}

// obecné tvary rostlin pro novou zeleninu a ovoce (podle look.t a barvy plodu look.c)
function drawLook(ctx, L, px, py, g, s, ready, sway) {
  const c = L.c || '#e0402d';
  const fruitOn = ready || g > 0.75;
  switch (L.t) {
    case 'root': {
      if (ready) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(px, py - 1, 3, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = '#5fae3a';
      for (const a of [-0.5, 0.5]) { ctx.beginPath(); ctx.ellipse(px + Math.sin(a) * 3 + sway, py - 6 * s, 2, 5 * s, a, 0, Math.PI * 2); ctx.fill(); }
      break;
    }
    case 'leafy': {
      const r = 7 * s;
      ctx.fillStyle = '#5fa83f'; ctx.beginPath(); ctx.arc(px, py - r * 0.7, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = c; ctx.beginPath(); ctx.arc(px, py - r * 0.8, r * 0.65, 0, Math.PI * 2); ctx.fill();
      break;
    }
    case 'bush': {
      const h = 16 * s;
      ctx.strokeStyle = '#4f8f37'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + sway, py - h); ctx.stroke();
      ctx.fillStyle = '#4f9a3a';
      ctx.beginPath(); ctx.arc(px + sway, py - h * 0.7, 6 * s, 0, Math.PI * 2); ctx.fill();
      if (fruitOn) {
        ctx.fillStyle = ready ? c : '#8fc45a';
        for (const [dx, dy] of [[-3, -0.5], [3, -0.6], [0, -0.85]]) { ctx.beginPath(); ctx.arc(px + dx + sway, py + dy * h, 2.4, 0, Math.PI * 2); ctx.fill(); }
      }
      break;
    }
    case 'vine': {
      ctx.fillStyle = '#4f9a3a';
      for (const [dx, dy] of [[-5, -2], [4, -3], [0, -5]]) { ctx.beginPath(); ctx.ellipse(px + dx, py + dy * s, 4 * s, 2.6 * s, 0.4, 0, Math.PI * 2); ctx.fill(); }
      if (fruitOn) {
        const big = c !== '#3f8f3a';
        ctx.fillStyle = ready ? c : '#8fc45a';
        ctx.beginPath(); ctx.ellipse(px + 2, py - 1, big ? 5 : 4.5, big ? 4 : 2, big ? 0 : 0.3, 0, Math.PI * 2); ctx.fill();
      }
      break;
    }
    case 'bulb': {
      if (ready || g > 0.6) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(px, py - 1.5, 3, 0, Math.PI * 2); ctx.fill(); }
      ctx.strokeStyle = '#5fae3a'; ctx.lineWidth = 1.6;
      for (const dx of [-2, 0, 2]) { ctx.beginPath(); ctx.moveTo(px, py - 3); ctx.lineTo(px + dx * 2 + sway, py - 14 * s); ctx.stroke(); }
      break;
    }
    case 'pod': {
      const h = 15 * s;
      ctx.strokeStyle = '#5fae3a'; ctx.lineWidth = 1.4;
      for (const dx of [-3, 3]) { ctx.beginPath(); ctx.moveTo(px + dx, py); ctx.quadraticCurveTo(px + dx * 2 + sway, py - h / 2, px + dx + sway, py - h); ctx.stroke(); }
      if (fruitOn) { ctx.fillStyle = ready ? c : '#a8dc6a'; for (const dy of [0.4, 0.7]) { ctx.beginPath(); ctx.ellipse(px + sway, py - h * dy, 1.6, 3.4, 0.3, 0, Math.PI * 2); ctx.fill(); } }
      break;
    }
    case 'berry': {
      ctx.fillStyle = '#3f8f3a';
      for (const [dx, dy] of [[-4, -2], [4, -2], [0, -4]]) { ctx.beginPath(); ctx.ellipse(px + dx, py + dy, 3.4 * s, 2.2 * s, 0, 0, Math.PI * 2); ctx.fill(); }
      if (fruitOn) { ctx.fillStyle = ready ? c : '#f2f2d0'; for (const dx of [-3, 3]) { ctx.beginPath(); ctx.arc(px + dx, py, 2, 0, Math.PI * 2); ctx.fill(); } }
      break;
    }
    default:
      ctx.fillStyle = '#5fae3a';
      ctx.beginPath(); ctx.arc(px, py - 5 * s, 5 * s, 0, Math.PI * 2); ctx.fill();
  }
}

function drawCrops(ctx, plot, st, t) {
  const [cx, cy] = cellCenter(plot.x, plot.y);
  const top = cy - TH / 2;
  const pts = [];
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) pts.push([i, j]);
  pts.sort((a, b) => (a[0] + a[1]) - (b[0] + b[1]));
  for (const [i, j] of pts) {
    const u = (i + 0.5) / 3, v = (j + 0.5) / 3;
    const px = cx + (u - v) * (TW - 16) / 2;
    const py = top + 2 + (u + v) * (TH - 6) / 2;
    drawPlant(ctx, plot.crop, px, py, st.progress, st.state === 'ready', t);
  }
  if (st.state === 'ready') {
    const a = 0.5 + 0.5 * Math.sin(t / 250);
    ctx.fillStyle = `rgba(255,255,220,${0.4 + a * 0.5})`;
    ctx.beginPath(); ctx.arc(cx + 14, cy - 24 - a * 3, 2.5, 0, Math.PI * 2); ctx.fill();
  }
}

// view = { farm, now, t, cam, W, H, ghost, hoverCell, bubble, floats }
function drawScene(ctx, view) {
  const { farm, cam, W, H, t } = view;
  ctx.fillStyle = '#5b9e3e';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-cam.x, -cam.y);

  // tráva: vlastní země světlá, nekoupené pozemky jako divoká louka
  for (let gy = WORLD.y0; gy < WORLD.y1; gy++) {
    for (let gx = WORLD.x0; gx < WORLD.x1; gx++) {
      const own = landOwned(farm, gx, gy);
      const [x, y] = cellCenter(gx, gy);
      diamond(ctx, x, y, TW + 1, TH + 1);
      ctx.fillStyle = own ? ((gx + gy) % 2 ? '#7cc251' : '#78bd4d') : ((gx * 7 + gy * 3) % 5 ? '#62a240' : '#5e9c3d');
      ctx.fill();
    }
  }
  // městečko: tráva, prašná cesta, dlážděné náměstí a plochy pod budovami
  for (let gy = GRID_H; gy < TOWN.y1 + 3; gy++) {
    for (let gx = GRID_W; gx < TOWN.x1 + 3; gx++) {
      const inWorld = gx < WORLD.x1 && gy < WORLD.y1 && gx >= WORLD.x0 && gy >= WORLD.y0;
      const road = isRoad(gx, gy) || (gx >= TOWN.x1 - 1 && gy >= TOWN.y1 - 1 && Math.abs(gx - gy) <= 1);
      if (!road && (inWorld || gx < TOWN.x0 || gy < TOWN.y0)) continue;
      const [x, y] = cellCenter(gx, gy);
      diamond(ctx, x, y, TW + 1, TH + 1);
      ctx.fillStyle = isPlaza(gx, gy) ? ((gx + gy) % 2 ? '#cdb892' : '#c4ad85')
        : road ? ((gx * 5 + gy * 3) % 4 ? '#b48a58' : '#ad8452')
        : townAt(gx, gy) ? '#d6c49c'
        : ((gx * 7 + gy * 3) % 5 ? '#6aae45' : '#66a942');
      ctx.fill();
      if (road && !isPlaza(gx, gy) && (gx * 13 + gy * 7) % 5 === 0) {   // kamínky a vyjeté koleje
        ctx.fillStyle = 'rgba(90,60,30,0.35)';
        ctx.beginPath(); ctx.ellipse(x - 12, y + 3, 3, 1.6, 0, 0, Math.PI * 2); ctx.ellipse(x + 14, y - 4, 2.4, 1.2, 0, 0, Math.PI * 2); ctx.fill();
      }
      if (isPlaza(gx, gy)) { ctx.strokeStyle = 'rgba(120,95,60,0.35)'; ctx.lineWidth = 1; diamond(ctx, x, y, TW - 4, TH - 2); ctx.stroke(); }
    }
  }
  drawFence(ctx, farm);

  // pole v pořadí hloubky
  // pole a budovy v pořadí hloubky
  const ghost = view.ghost;
  const items = farm.plots.map(p => ({ d: p.x + p.y + 1, p }));
  for (const o of farm.objects) if (!ghost || ghost.moveId !== o.id) items.push({ d: objectDepth(o), o });
  for (const tr of BG_TREES) if (!landOwned(farm, tr.gx, tr.gy)) items.push({ d: tr.gx + tr.gy + 1, tree: tr });
  for (const pp of view.people || []) items.push({ d: pp.gx + pp.gy + 0.05, person: pp });
  for (const b of TOWN_BUILDINGS) { const o = townObject(farm, b.kind); items.push({ d: objectDepth(o), o }); }
  for (const h of TOWN_HOUSES) items.push({ d: h[0] + h[1] + 2, house: h });
  for (const p of LAND_PARCELS) {
    if (!farm.land.includes(p.id) && landReachable(farm, p)) items.push({ d: p.x + p.y + (p.w + p.h) / 2 + 0.5, sign: p });
  }
  items.sort((a, b) => a.d - b.d);
  for (const it of items) {
    if (it.p) {
      const p = it.p;
      drawPlot(ctx, p.x, p.y, !!p.crop);
      if (p.crop) drawCrops(ctx, p, plotState(p, view.now), t);
    } else if (it.tree) drawTree(ctx, it.tree);
    else if (it.person) {
      const pp = it.person;
      const [px, py] = [(pp.gx - pp.gy) * TW / 2, (pp.gx + pp.gy) * TH / 2];
      drawPerson(ctx, px, py, pp.shirt, pp.hat, t, pp.walking, pp.work);
    }
    else if (it.sign) drawSaleSign(ctx, farm, it.sign);
    else if (it.house) drawTownHouse(ctx, it.house[0], it.house[1], it.house[2], it.house[3]);
    else {
      drawObject(ctx, it.o, view.now, t, farm);
      if (it.o.town) townLabel(ctx, it.o);
    }
  }
  if (ghost) drawGhost(ctx, ghost, view.now, t);

  if (view.hoverCell) {
    const [gx, gy] = view.hoverCell;
    const [x, y] = cellCenter(gx, gy);
    diamond(ctx, x, y, TW - 6, TH - 3);
    ctx.strokeStyle = '#fff6b0'; ctx.lineWidth = 3; ctx.stroke();
  }
  ctx.restore();

  // bublina s informací o poli (v obrazovkových souřadnicích)
  if (view.bubble) {
    const b = view.bubble;
    const p = farm.plots.find(q => q.x === b.gx && q.y === b.gy);
    const st = p && plotState(p, view.now);
    if (st && st.state === 'growing') {
      const [sx, sy] = cellToScreen(b.gx, b.gy, cam, W, H);
      const c = CROPS[p.crop];
      const bw = 150, bh = 52, bx = sx - bw / 2, by = sy - 40 * cam.zoom - bh;
      ctx.fillStyle = 'rgba(255,250,235,0.96)';
      roundRect(ctx, bx, by, bw, bh, 12); ctx.fill();
      ctx.strokeStyle = '#a0763f'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#4a3218';
      ctx.font = '600 14px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`${c.name} · ${fmtTime(st.left)}`, sx, by + 21);
      ctx.fillStyle = '#e4d6b8'; roundRect(ctx, bx + 14, by + 32, bw - 28, 9, 4.5); ctx.fill();
      ctx.fillStyle = '#6fbf3f'; roundRect(ctx, bx + 14, by + 32, (bw - 28) * st.progress, 9, 4.5); ctx.fill();
    }
  }

  // plovoucí texty (+2 🌾 apod.)
  for (const f of view.floats) {
    const age = (t - f.t0) / 1300;
    if (age >= 1) continue;
    const [sx, sy] = cellToScreen(f.gx, f.gy, cam, W, H);
    ctx.globalAlpha = 1 - age * age;
    ctx.font = '700 18px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(60,35,10,0.8)';
    ctx.fillStyle = '#fff';
    drawIconText(ctx, f.text, sx, sy - 30 - age * 40, 20, true);
    ctx.globalAlpha = 1;
  }

  // den a noc podle hodin v zařízení
  const tint = skyTint(view.hour);
  if (tint) { ctx.fillStyle = tint; ctx.fillRect(0, 0, W, H); }
}

// barevný nádech podle denní doby (h = hodina s desetinami)
function skyTint(h) {
  if (h === undefined) return null;
  const night = 'rgba(20,30,90,', dusk = 'rgba(255,120,40,';
  if (h >= 22 || h < 5) return night + '0.38)';
  if (h >= 5 && h < 7) { const k = (h - 5) / 2; return k < 0.5 ? night + (0.38 * (1 - k * 2)).toFixed(2) + ')' : dusk + (0.12 * (1 - k)).toFixed(2) + ')'; }
  if (h >= 19 && h < 20.5) return dusk + (0.16 * (h - 19) / 1.5).toFixed(2) + ')';
  if (h >= 20.5 && h < 22) return night + (0.38 * (h - 20.5) / 1.5).toFixed(2) + ')';
  return null;
}

function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, h / 2, Math.max(0, w) / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function fmtTime(sec) {
  if (sec < 60) return `${sec} s`;
  if (sec < 3600) return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  return `${h} h ${String(m).padStart(2, '0')} min`;
}

// ---- public/js/objects.js ----
// EKOfarm – kreslení budov, ohrad se zvířaty a ozdob (izometricky).




// izometrický bod pro (i zlomkové) souřadnice mřížky
function iso(gx, gy) { return [(gx - gy) * TW / 2, (gx + gy) * TH / 2]; }

function poly(ctx, pts, fill) {
  ctx.beginPath();
  pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
}

function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.max(0, Math.min(255, Math.round(v * f))));
  return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
}

// krabice s jehlanovou střechou na obdélníku x0..x1, y0..y1 (v buňkách)
function house(ctx, x0, y0, x1, y1, wallH, roofH, wall, roof) {
  const N = iso(x0, y0), E = iso(x1, y0), S = iso(x1, y1), W = iso(x0, y1);
  const up = ([x, y], h) => [x, y - h];
  poly(ctx, [W, S, up(S, wallH), up(W, wallH)], shade(wall, 0.82));
  poly(ctx, [S, E, up(E, wallH), up(S, wallH)], wall);
  const cx = (N[0] + S[0]) / 2, cy = (N[1] + S[1]) / 2;
  const apex = [cx, cy - wallH - roofH];
  const [n, e, s, w] = [N, E, S, W].map(p => up(p, wallH));
  poly(ctx, [n, e, apex], shade(roof, 0.75));
  poly(ctx, [w, n, apex], shade(roof, 0.9));
  poly(ctx, [w, s, apex], shade(roof, 1.0));
  poly(ctx, [s, e, apex], shade(roof, 0.85));
  return { W, S, E, N, apex };
}

function bubble(ctx, x, y, icon, count, faded) {
  ctx.save();
  ctx.globalAlpha = faded ? 0.75 : 1;
  ctx.fillStyle = '#fff8e7';
  ctx.strokeStyle = '#a0763f';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(x, y, 15, 0, Math.PI * 2);
  ctx.moveTo(x - 5, y + 13); ctx.lineTo(x, y + 21); ctx.lineTo(x + 5, y + 13);
  ctx.fill(); ctx.stroke();
  drawIcon(ctx, icon, x, y, 21);
  if (count > 1) {
    ctx.fillStyle = '#c8452d';
    ctx.beginPath(); ctx.arc(x + 12, y - 11, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '700 10px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(count), x + 12, y - 10.5);
  }
  ctx.restore();
}

// ---------- výrobní budova ----------
function drawFactory(ctx, o, d, now, t) {
  const m = 0.18;
  const st = objectStatus(o, now);
  const h = house(ctx, o.x + m, o.y + m, o.x + d.w - m, o.y + d.h - m, 46, 34, d.color, '#a8483a');
  // dveře na levé stěně a okno na pravé
  const lerp = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
  const d0 = lerp(h.W, h.S, 0.4), d1 = lerp(h.W, h.S, 0.62);
  poly(ctx, [d0, d1, [d1[0], d1[1] - 26], [d0[0], d0[1] - 26]], '#5b3a1e');
  const w0 = lerp(h.S, h.E, 0.35), w1 = lerp(h.S, h.E, 0.65);
  poly(ctx, [[w0[0], w0[1] - 16], [w1[0], w1[1] - 16], [w1[0], w1[1] - 32], [w0[0], w0[1] - 32]], '#fdf3c4');
  // cedule s ikonou
  ctx.font = '18px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const sg = lerp(h.W, h.S, 0.82);
  drawIcon(ctx, d.icon, sg[0], sg[1] - 30, 18);
  // komín a kouř při výrobě
  const ch = lerp(h.apex, h.E, 0.45);
  poly(ctx, [[ch[0] - 5, ch[1] + 4], [ch[0] + 5, ch[1] + 4], [ch[0] + 5, ch[1] - 14], [ch[0] - 5, ch[1] - 14]], '#7a5a48');
  if (st.busy) {
    for (let i = 0; i < 3; i++) {
      const k = ((t / 1400 + i / 3) % 1);
      ctx.fillStyle = `rgba(240,240,240,${0.7 * (1 - k)})`;
      ctx.beginPath(); ctx.arc(ch[0] + Math.sin(k * 6 + i) * 4, ch[1] - 18 - k * 34, 4 + k * 7, 0, Math.PI * 2); ctx.fill();
    }
  }
  if (d.id === 'mlyn') {
    // větrník mlýna – točí se, když mele
    const [bx, by] = [h.apex[0] - 6, h.apex[1] + 22];
    const rot = st.busy ? t / 500 : 0.3;
    ctx.strokeStyle = '#7a5a48'; ctx.lineWidth = 2.5;
    for (let k = 0; k < 4; k++) {
      const a = rot + k * Math.PI / 2;
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + Math.cos(a) * 30, by + Math.sin(a) * 30); ctx.stroke();
      ctx.save(); ctx.translate(bx, by); ctx.rotate(a);
      ctx.fillStyle = 'rgba(250,245,230,0.92)'; ctx.fillRect(8, 0, 22, 7);
      ctx.restore();
    }
    ctx.fillStyle = '#5b3a1e'; ctx.beginPath(); ctx.arc(bx, by, 3.5, 0, Math.PI * 2); ctx.fill();
  }
  if (st.done) {
    const first = queueState(o, now).find(q => q.state === 'done');
    bubble(ctx, h.apex[0], h.apex[1] - 26 + Math.sin(t / 300) * 2, ITEMS[first.r].icon, st.done);
  }
}

// ---------- ohrada se zvířaty ----------
function drawChicken(ctx, x, y, dir, t, i) {
  const bob = Math.abs(Math.sin(t / 180 + i)) * 1.5;
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath(); ctx.ellipse(x, y, 7, 3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fbfaf4';
  ctx.beginPath(); ctx.ellipse(x, y - 7 - bob, 7, 5.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 5 * dir, y - 13 - bob, 3.6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#d9402b';
  ctx.beginPath(); ctx.arc(x + 5 * dir, y - 17 - bob, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f2a52b';
  ctx.beginPath(); ctx.moveTo(x + 8 * dir, y - 13 - bob); ctx.lineTo(x + 11 * dir, y - 12 - bob); ctx.lineTo(x + 8 * dir, y - 11 - bob); ctx.fill();
}

function drawCow(ctx, x, y, dir, t, i) {
  const bob = Math.abs(Math.sin(t / 400 + i)) * 0.8;
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath(); ctx.ellipse(x, y, 14, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#3d3029';
  for (const lx of [-8, -3, 4, 9]) ctx.fillRect(x + lx, y - 8, 2.5, 8);
  ctx.fillStyle = '#f7f3ec';
  ctx.beginPath(); ctx.ellipse(x, y - 13 - bob, 13, 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#3d3029';
  ctx.beginPath(); ctx.ellipse(x - 4, y - 15 - bob, 4, 3, 0.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + 5, y - 11 - bob, 3, 2.4, -0.3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f7f3ec';
  ctx.beginPath(); ctx.ellipse(x + 14 * dir, y - 17 - bob, 5.5, 4.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f2b7a8';
  ctx.beginPath(); ctx.ellipse(x + 17 * dir, y - 15.5 - bob, 3, 2.2, 0, 0, Math.PI * 2); ctx.fill();
}

function drawPig(ctx, x, y, dir, t, i) {
  const bob = Math.abs(Math.sin(t / 300 + i)) * 0.8;
  ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.beginPath(); ctx.ellipse(x, y, 12, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e08a96';
  for (const lx of [-6, -2, 3, 7]) ctx.fillRect(x + lx, y - 6, 2.4, 6);
  ctx.fillStyle = '#f5b0b8';
  ctx.beginPath(); ctx.ellipse(x, y - 10 - bob, 11, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + 11 * dir, y - 12 - bob, 5, 4.6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e08a96';
  ctx.beginPath(); ctx.ellipse(x + 15 * dir, y - 11.5 - bob, 2.4, 2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + 9 * dir, y - 16 - bob); ctx.lineTo(x + 10 * dir, y - 20 - bob); ctx.lineTo(x + 12 * dir, y - 16 - bob); ctx.fill();
}

function drawSheep(ctx, x, y, dir, t, i) {
  const bob = Math.abs(Math.sin(t / 350 + i)) * 0.8;
  ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.beginPath(); ctx.ellipse(x, y, 12, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#4a3f38';
  for (const lx of [-6, -2, 3, 7]) ctx.fillRect(x + lx, y - 7, 2.2, 7);
  ctx.fillStyle = '#f7f3ec';
  for (const [dx, dy, r] of [[-5, -11, 6], [3, -12, 7], [8, -10, 5], [-1, -15, 5]]) { ctx.beginPath(); ctx.arc(x + dx * dir, y + dy - bob, r, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = '#4a3f38';
  ctx.beginPath(); ctx.ellipse(x + 13 * dir, y - 14 - bob, 3.6, 4.4, 0, 0, Math.PI * 2); ctx.fill();
}

function drawPen(ctx, o, d, now, t) {
  const an = ANIMALS[d.animal];
  const N = iso(o.x, o.y), E = iso(o.x + d.w, o.y), S = iso(o.x + d.w, o.y + d.h), W = iso(o.x, o.y + d.h);
  poly(ctx, [N, E, S, W], { krava: '#a9c76b', prase: '#a8875a', ovce: '#b8d88a' }[d.animal] || '#c9b77c');
  // domek v zadním rohu
  const hs = d.w >= 3 ? 1.2 : 0.9;
  house(ctx, o.x + 0.1, o.y + 0.1, o.x + 0.1 + hs, o.y + 0.1 + hs, 26, 18, { krava: '#b5523b', prase: '#c98a6a', ovce: '#d9c9a8' }[d.animal] || '#e7c27a', '#8a3b2c');
  if (d.animal === 'prase') { const [mx, my] = iso(o.x + d.w * 0.7, o.y + d.h * 0.75); ctx.fillStyle = 'rgba(110,70,30,.55)'; ctx.beginPath(); ctx.ellipse(mx, my, 22, 9, 0, 0, Math.PI * 2); ctx.fill(); }
  // zvířata
  const animals = o.animals || [];
  animals.forEach((a, i) => {
    const st = animalState(a, an, now);
    const sp = st.state === 'eating' ? 1 : 0.35;
    const u = 0.55 + 0.25 * Math.sin(t / (2600 / sp) + i * 2.3);
    const v = 0.35 + 0.18 * i + 0.1 * Math.cos(t / (3100 / sp) + i * 1.7);
    const [x, y] = iso(o.x + u * d.w, o.y + Math.min(0.88, v) * d.h);
    const dir = Math.cos(t / (2600 / sp) + i * 2.3) > 0 ? 1 : -1;
    if (d.animal === 'krava') drawCow(ctx, x, y, dir, t, i);
    else if (d.animal === 'prase') drawPig(ctx, x, y, dir, t, i);
    else if (d.animal === 'ovce') drawSheep(ctx, x, y, dir, t, i);
    else drawChicken(ctx, x, y, dir, t, i);
    if (st.state === 'ready') {
      ctx.font = '14px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
      ctx.textAlign = 'center';
      drawIcon(ctx, ITEMS[an.product].icon, x, y - (d.animal === 'slepice' ? 28 : 36), 14);
    }
  });
  // plot
  const rail = (a, b) => {
    ctx.strokeStyle = '#9b6b3c'; ctx.lineWidth = 2.5;
    for (const off of [5, 11]) { ctx.beginPath(); ctx.moveTo(a[0], a[1] - off); ctx.lineTo(b[0], b[1] - off); ctx.stroke(); }
    ctx.fillStyle = '#7d532c';
    const n = 4 * d.w;
    for (let k = 0; k <= n; k++) {
      const px = a[0] + (b[0] - a[0]) * k / n, py = a[1] + (b[1] - a[1]) * k / n;
      ctx.fillRect(px - 1.5, py - 14, 3, 14);
    }
  };
  rail(N, E); rail(N, W); rail(W, S); rail(S, E);
  const st = objectStatus(o, now);
  const top = iso(o.x + d.w / 2, o.y + d.h / 2);
  const by = top[1] - 30 * d.h / 2 - 20 + Math.sin(t / 300) * 2;
  if (st.done) bubble(ctx, top[0], by, ITEMS[an.product].icon, st.done);
  else if (st.hungry && animals.length) bubble(ctx, top[0], by, ITEMS[an.feed].icon, 0, true);
}

// ---------- sad se stromem ----------
function drawOrchard(ctx, o, d, now, t) {
  const N = iso(o.x + 0.06, o.y + 0.06), E = iso(o.x + 0.94, o.y + 0.06), S = iso(o.x + 0.94, o.y + 0.94), W = iso(o.x + 0.06, o.y + 0.94);
  poly(ctx, [N, E, S, W], '#5fa83f');
  ctx.strokeStyle = '#8e6b3c'; ctx.lineWidth = 2;
  ctx.beginPath(); [N, E, S, W].forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath(); ctx.stroke();
  const [cx, cy] = iso(o.x + 0.5, o.y + 0.5);
  ctx.fillStyle = '#7a5030';
  ctx.beginPath(); ctx.ellipse(cx, cy, 12, 6, 0, 0, Math.PI * 2); ctx.fill();
  const st = treeState(o, now);
  if (st.state === 'empty') return;
  const tr = TREES[o.tree];
  const g = st.state === 'growing' && o.left === tr.harvests ? 0.35 + 0.65 * st.progress : 1;
  const sway = st.state === 'ready' ? Math.sin(t / 500 + o.x) * 1.2 : 0;
  if (tr.kind === 'bush') {           // keř: nízký a kulatý, bobule po celém keři
    const r = 12 * g;
    ctx.fillStyle = st.state === 'dead' ? '#8a7a5c' : '#3f8a35';
    ctx.beginPath(); ctx.arc(cx - 6 * g, cy - r * 0.8, r * 0.75, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 6 * g, cy - r * 0.8, r * 0.75, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = st.state === 'dead' ? '#9a8a6a' : '#4ea845';
    ctx.beginPath(); ctx.arc(cx + sway, cy - r * 1.25, r * 0.8, 0, Math.PI * 2); ctx.fill();
    if (st.state === 'dead') { drawIcon(ctx, 'axe', cx + 14, cy - 28, 14); return; }
    if (st.state === 'ready' || st.progress > 0.5) {
      ctx.fillStyle = st.state === 'ready' ? tr.color : '#b8dc8a';
      for (const [dx, dy] of [[-10, -9], [-4, -16], [4, -12], [10, -8], [0, -22], [7, -19], [-8, -18]]) {
        ctx.beginPath(); ctx.arc(cx + dx * g + sway, cy + dy * g, st.state === 'ready' ? 2.6 : 1.6, 0, Math.PI * 2); ctx.fill();
      }
    }
    return;
  }
  // kmen
  ctx.fillStyle = st.state === 'dead' ? '#6b5440' : '#7a4e2a';
  ctx.fillRect(cx - 2.5 * g, cy - 24 * g, 5 * g, 24 * g);
  if (st.state === 'dead') {
    ctx.strokeStyle = '#6b5440'; ctx.lineWidth = 2.5;
    for (const [dx, dy] of [[-9, -34], [8, -36], [0, -40]]) { ctx.beginPath(); ctx.moveTo(cx, cy - 20); ctx.lineTo(cx + dx, cy + dy); ctx.stroke(); }
    ctx.font = '13px system-ui, sans-serif'; ctx.textAlign = 'center';
    drawIcon(ctx, 'axe', cx + 14, cy - 34, 14);
    return;
  }
  // koruna
  const r = 15 * g;
  ctx.fillStyle = '#3f8f3a'; ctx.beginPath(); ctx.arc(cx + sway, cy - 30 * g, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#4ea845'; ctx.beginPath(); ctx.arc(cx - 5 * g + sway, cy - 35 * g, r * 0.65, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#63bd55'; ctx.beginPath(); ctx.arc(cx - 7 * g + sway, cy - 39 * g, r * 0.3, 0, Math.PI * 2); ctx.fill();
  // ovoce: malé při růstu, plné když je zralé
  const fr = st.state === 'ready' ? 3.2 : st.progress > 0.5 ? 1.8 : 0;
  if (fr) {
    ctx.fillStyle = st.state === 'ready' ? tr.color : '#9ccc5c';
    for (const [dx, dy] of [[-8, -26], [6, -34], [9, -22], [-2, -40], [0, -24], [-10, -36]]) {
      ctx.beginPath(); ctx.arc(cx + dx * g + sway, cy + dy * g, fr, 0, Math.PI * 2); ctx.fill();
    }
  }
}

// ---------- statek ----------
function drawMain(ctx, o, d, now, t, farm) {
  const lerp = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
  // dvorek
  const N = iso(o.x, o.y), E = iso(o.x + 3, o.y), S = iso(o.x + 3, o.y + 3), W = iso(o.x, o.y + 3);
  poly(ctx, [N, E, S, W], '#d8c79a');
  // cestička k domu
  poly(ctx, [iso(o.x + 1.2, o.y + 2.2), iso(o.x + 1.8, o.y + 2.2), iso(o.x + 1.8, o.y + 3), iso(o.x + 1.2, o.y + 3)], '#c2ad7c');
  const h = house(ctx, o.x + 0.35, o.y + 0.3, o.x + 2.7, o.y + 2.2, 62, 48, '#f3e3c3', '#b9432f');
  // trámy (hrázděné zdi)
  ctx.strokeStyle = '#8a5a35'; ctx.lineWidth = 3;
  for (const [a, b] of [[h.W, h.S], [h.S, h.E]]) {
    for (const k of [0, 0.5, 1]) {
      const p = lerp(a, b, k);
      ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(p[0], p[1] - 62); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(a[0], a[1] - 62); ctx.lineTo(b[0], b[1] - 62); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(a[0], a[1] - 31); ctx.lineTo(b[0], b[1] - 31); ctx.stroke();
  }
  // dveře a okna
  const d0 = lerp(h.W, h.S, 0.62), d1 = lerp(h.W, h.S, 0.82);
  poly(ctx, [d0, d1, [d1[0], d1[1] - 30], [d0[0], d0[1] - 30]], '#6b3f1f');
  for (const [a, b, k] of [[h.W, h.S, 0.22], [h.S, h.E, 0.25], [h.S, h.E, 0.72]]) {
    const w0 = lerp(a, b, k - 0.09), w1 = lerp(a, b, k + 0.09);
    poly(ctx, [[w0[0], w0[1] - 38], [w1[0], w1[1] - 38], [w1[0], w1[1] - 54], [w0[0], w0[1] - 54]], '#fdf3c4');
  }
  // komín
  const ch = lerp(h.apex, h.N, 0.35);
  poly(ctx, [[ch[0] - 6, ch[1] + 6], [ch[0] + 6, ch[1] + 6], [ch[0] + 6, ch[1] - 16], [ch[0] - 6, ch[1] - 16]], '#8c6a55');
  for (let i = 0; i < 2; i++) {
    const k = ((t / 2200 + i / 2) % 1);
    ctx.fillStyle = `rgba(245,245,245,${0.5 * (1 - k)})`;
    ctx.beginPath(); ctx.arc(ch[0] + Math.sin(k * 5) * 4, ch[1] - 20 - k * 30, 4 + k * 6, 0, Math.PI * 2); ctx.fill();
  }
  // poštovní schránka u cesty
  const mb = iso(o.x + 2.3, o.y + 2.8);
  ctx.fillStyle = '#7a4e2a'; ctx.fillRect(mb[0] - 1.5, mb[1] - 16, 3, 16);
  ctx.fillStyle = '#4f8fd6'; ctx.fillRect(mb[0] - 6, mb[1] - 24, 12, 9);
  // bublina: zakázky připravené k doručení
  const st = objectStatus(o, now, farm);
  if (st.done) bubble(ctx, h.apex[0], h.apex[1] - 22 + Math.sin(t / 300) * 2, 'truck', st.done);
}

// ---------- sklad (stodola se silem) ----------
function drawStorage(ctx, o, d, now, t) {
  const lerp = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
  // silo vzadu
  const [sx, sy] = iso(o.x + 0.55, o.y + 0.55);
  ctx.fillStyle = '#b8c0c7'; ctx.fillRect(sx - 13, sy - 78, 26, 72);
  ctx.fillStyle = '#9aa3ab'; ctx.fillRect(sx + 3, sy - 78, 10, 72);
  ctx.fillStyle = '#c9d0d6'; ctx.beginPath(); ctx.ellipse(sx, sy - 6, 13, 6, 0, 0, Math.PI); ctx.fill();
  ctx.fillStyle = '#7d8a96'; ctx.beginPath(); ctx.arc(sx, sy - 78, 13, Math.PI, 0); ctx.fill();
  // stodola
  const h = house(ctx, o.x + 0.75, o.y + 0.65, o.x + 1.9, o.y + 1.9, 38, 26, '#b5523b', '#6f3a2a');
  const g0 = lerp(h.W, h.S, 0.25), g1 = lerp(h.W, h.S, 0.75);
  poly(ctx, [g0, g1, [g1[0], g1[1] - 28], [g0[0], g0[1] - 28]], '#f3e3c3');
  ctx.strokeStyle = '#b5523b'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(g0[0], g0[1]); ctx.lineTo(g1[0], g1[1] - 28); ctx.moveTo(g1[0], g1[1]); ctx.lineTo(g0[0], g0[1] - 28); ctx.stroke();
}

// ---------- stroje ----------
function wheel(ctx, x, y, r) {
  ctx.fillStyle = '#2f2a26'; ctx.beginPath(); ctx.ellipse(x, y, r * 0.75, r, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c9b77c'; ctx.beginPath(); ctx.ellipse(x, y, r * 0.3, r * 0.4, 0, 0, Math.PI * 2); ctx.fill();
}

// stroj: dir = 1 jede doprava, -1 doleva; s = měřítko
function drawVehicle(ctx, cx, cy, model, dir, t, s = 0.75, working = false, tool = null) {
  const m = MACHINES[model];
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(dir * s, s);
  const bump = working ? Math.sin(t / 60) * 0.8 : 0;
  ctx.translate(0, bump);
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.ellipse(0, 0, 40, 17, 0, 0, Math.PI * 2); ctx.fill();
  const c = m.color, dark = shade(m.color, 0.78);
  if (m.type === 'tractor') {
    wheel(ctx, 18, -4, 9);
    ctx.fillStyle = c; ctx.fillRect(-10, -30, 34, 18);            // kapota
    ctx.fillStyle = dark; ctx.fillRect(-10, -14, 34, 4);
    ctx.fillStyle = c; ctx.fillRect(-26, -46, 20, 34);           // kabina
    ctx.fillStyle = '#cfe8f5'; ctx.fillRect(-23, -43, 14, 14);
    ctx.fillStyle = '#555'; ctx.fillRect(14, -40, 4, 12);         // výfuk
    if (working) {
      for (let i = 0; i < 2; i++) {
        const k = ((t / 700 + i / 2) % 1);
        ctx.fillStyle = `rgba(90,90,90,${0.45 * (1 - k)})`;
        ctx.beginPath(); ctx.arc(16 - k * 6, -44 - k * 18, 3 + k * 4, 0, Math.PI * 2); ctx.fill();
      }
      if (tool === 'plow') {           // pluh: radlice za traktorem
        ctx.fillStyle = '#555'; ctx.fillRect(-40, -12, 14, 3);
        ctx.fillStyle = '#8a8f96';
        for (const x of [-52, -44, -36]) { ctx.beginPath(); ctx.moveTo(x, -12); ctx.lineTo(x + 6, -12); ctx.lineTo(x - 2, 0); ctx.closePath(); ctx.fill(); }
      } else if (tool === 'seeder') {  // secí stroj
        ctx.fillStyle = '#3f7fbf'; ctx.fillRect(-58, -24, 32, 14);
        ctx.fillStyle = '#2f63a0'; ctx.fillRect(-58, -28, 32, 5);
        ctx.fillStyle = '#555'; for (const x of [-54, -46, -38, -30]) ctx.fillRect(x, -10, 2, 8);
      } else if (tool === 'baler') {   // lis na balíky
        ctx.fillStyle = '#d9b43b'; ctx.fillRect(-62, -30, 34, 22);
        ctx.fillStyle = '#f2da7a'; ctx.fillRect(-58, -26, 14, 12);
        wheel(ctx, -50, -4, 7);
      } else {
        ctx.fillStyle = '#7a7a7a'; ctx.fillRect(-46, -14, 18, 6);    // brány
      }
    }
    wheel(ctx, -18, -8, 15);
    wheel(ctx, 22, -2, 9);
  } else {
    ctx.fillStyle = '#d9b43b'; ctx.fillRect(16, -12, 22, 10);    // žací lišta
    ctx.strokeStyle = '#8a7020'; ctx.lineWidth = 2;
    const rot = working ? t / 120 : 0;
    for (let k = 0; k < 4; k++) {
      const a = rot + k * Math.PI / 2;
      ctx.beginPath(); ctx.moveTo(27, -18); ctx.lineTo(27 + Math.cos(a) * 9, -18 + Math.sin(a) * 9); ctx.stroke();
    }
    ctx.fillStyle = c; ctx.fillRect(-26, -34, 42, 24);           // tělo
    ctx.fillStyle = dark; ctx.fillRect(-26, -14, 42, 4);
    ctx.fillStyle = c; ctx.fillRect(-6, -52, 18, 20);            // kabina
    ctx.fillStyle = '#cfe8f5'; ctx.fillRect(-3, -49, 12, 11);
    ctx.fillStyle = '#d9b43b'; ctx.fillRect(-30, -42, 8, 22);    // výsypka
    wheel(ctx, -14, -6, 12);
    wheel(ctx, 10, -4, 8);
  }
  ctx.restore();
}

// ---------- velké pole ----------
function bale(ctx, x, y) {
  ctx.fillStyle = '#d9b43b'; ctx.beginPath(); ctx.ellipse(x, y - 3, 7, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f2da7a'; ctx.beginPath(); ctx.ellipse(x - 3, y - 4, 4, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#b8902a'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x - 3, y - 4, 2, 0, Math.PI * 2); ctx.stroke();
}

function drawBigField(ctx, o, d, now, t, farm) {
  const W = o.w, H = o.h, cells = W * H;
  const N = iso(o.x, o.y), E = iso(o.x + W, o.y), S = iso(o.x + W, o.y + H), Wp = iso(o.x, o.y + H);
  const st = fieldState(o, now);
  const soil = o.soil || 'raw';
  poly(ctx, [N, E, S, Wp], '#8a6a3f');
  const m = 0.08;
  const dark = ['plowed', 'sown'].includes(soil) && st.state !== 'plowing';
  poly(ctx, [iso(o.x + m, o.y + m), iso(o.x + W - m, o.y + m), iso(o.x + W - m, o.y + H - m), iso(o.x + m, o.y + H - m)], dark ? '#6a4122' : '#8e5d33');
  ctx.strokeStyle = dark ? 'rgba(40,18,4,0.4)' : 'rgba(50,25,8,0.22)'; ctx.lineWidth = dark ? 2.4 : 1.6;
  for (let r = 1; r < H * 2; r++) {
    const a = iso(o.x + m, o.y + r / 2), b = iso(o.x + W - m, o.y + r / 2);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  }
  const order = (gx, gy) => gy * W + (gy % 2 ? W - 1 - gx : gx);
  const working = ['sowing', 'harvesting', 'plowing', 'baling'].includes(st.state);
  const done = working ? st.progress * cells : 0;
  const crop = o.crop || (st.state === 'harvesting' && o.load ? o.load.item : null);
  const strawField = st.state === 'empty' && o.straw;
  const balesOut = st.state === 'unload' && st.item === 'slama';
  for (let sum = 0; sum <= W + H - 2; sum++) {
    for (let gx = 0; gx < W; gx++) {
      const gy = sum - gx;
      if (gy < 0 || gy >= H) continue;
      const idx = order(gx, gy);
      const passed = idx < done;
      let g = -1, ready = false, stubble = false, straw = false, plowCell = false, baleCell = false;
      switch (st.state) {
        case 'sowing': g = passed ? 0.05 : -1; break;
        case 'growing': g = st.progress; break;
        case 'ready': g = 1; ready = true; break;
        case 'harvesting': if (passed) { stubble = true; straw = true; } else { g = 1; ready = true; } break;
        case 'plowing': plowCell = passed; stubble = !passed && soil !== 'raw'; break;
        case 'baling': if (passed) { stubble = true; baleCell = idx % 2 === 0; } else { stubble = true; straw = true; } break;
        case 'unload': stubble = true; baleCell = balesOut && idx % 2 === 0; straw = !balesOut && o.straw; break;
        default: stubble = soil === 'stubble'; straw = strawField;
      }
      const [cx, cy] = iso(o.x + gx + 0.5, o.y + gy + 0.5);
      if (plowCell) {
        ctx.fillStyle = 'rgba(70,35,10,0.45)';
        ctx.beginPath(); ctx.ellipse(cx, cy, TW / 2 - 6, TH / 2 - 3, 0, 0, Math.PI * 2); ctx.fill();
      }
      if (baleCell) { bale(ctx, cx, cy); continue; }
      for (const [u, v] of [[0.3, 0.3], [0.7, 0.3], [0.3, 0.7], [0.7, 0.7]]) {
        const [px, py] = iso(o.x + gx + u, o.y + gy + v);
        if (stubble) {
          ctx.strokeStyle = '#c9a53a'; ctx.lineWidth = 1.4;
          ctx.beginPath(); ctx.moveTo(px - 2, py); ctx.lineTo(px - 2, py - 3); ctx.moveTo(px + 2, py); ctx.lineTo(px + 2, py - 3); ctx.stroke();
          if (straw) { ctx.strokeStyle = '#e8c95a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px - 5, py + 1); ctx.lineTo(px + 5, py - 1); ctx.stroke(); }
        } else if (g >= 0 && crop) drawPlant(ctx, crop, px, py, g, ready, t);
      }
    }
  }
  if (o.job && working) {
    const pos = Math.min(cells - 0.001, done);
    const i = Math.floor(pos), frac = pos - i;
    const row = Math.floor(i / W), along = i % W;
    const fwd = row % 2 === 0;
    const gx = fwd ? along + frac : W - along - frac;
    const [vx, vy] = iso(o.x + gx, o.y + row + 0.5);
    for (let k = 0; k < 4; k++) {
      const a = ((t / 500 + k / 4) % 1);
      ctx.fillStyle = `rgba(170,140,90,${0.35 * (1 - a)})`;
      ctx.beginPath(); ctx.arc(vx - (fwd ? 1 : -1) * (14 + a * 26), vy - 4 - a * 10 + (fwd ? -a * 8 : a * 8), 4 + a * 7, 0, Math.PI * 2); ctx.fill();
    }
    const mm = farm && farm.machines.find(x => x.id === o.job.m);
    const model = mm ? mm.model : st.state === 'harvesting' ? 'klas4' : 'brazda60';
    const hasSeeder = farm && farm.machines.some(x => MACHINES[x.model].type === 'seeder');
    const tool = st.state === 'plowing' ? 'plow' : st.state === 'baling' ? 'baler' : st.state === 'sowing' && hasSeeder ? 'seeder' : null;
    drawVehicle(ctx, vx, vy, model, fwd ? 1 : -1, t, 0.85, true, tool);
  }
  const top = iso(o.x + W / 2, o.y + H / 2);
  const by = top[1] - 40 + Math.sin(t / 300) * 2;
  if (st.state === 'ready') bubble(ctx, top[0], by, CROPS[o.crop].icon, 0);
  else if (st.state === 'unload') bubble(ctx, top[0], by, ITEMS[st.item].icon, st.stock);
}

// ---------- ozdoby ----------
function drawDeco(ctx, o, d, now, t) {
  const [cx, cy] = iso(o.x + 0.5, o.y + 0.5);
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath(); ctx.ellipse(cx, cy, 20, 9, 0, 0, Math.PI * 2); ctx.fill();
  switch (d.id) {
    case 'ker':
      for (const [dx, dy, r, c] of [[-8, -8, 10, '#3f8f3a'], [8, -8, 10, '#3f8f3a'], [0, -14, 12, '#4ea845'], [-3, -18, 6, '#63bd55']]) {
        ctx.fillStyle = c; ctx.beginPath(); ctx.arc(cx + dx, cy + dy, r, 0, Math.PI * 2); ctx.fill();
      }
      break;
    case 'kvetiny': {
      const N = iso(o.x + 0.15, o.y + 0.15), E = iso(o.x + 0.85, o.y + 0.15), S = iso(o.x + 0.85, o.y + 0.85), W = iso(o.x + 0.15, o.y + 0.85);
      poly(ctx, [N, E, S, W], '#7a5030');
      const cols = ['#e5484d', '#f5c542', '#ffffff', '#c45fd6', '#ff8a3d'];
      for (let i = 0; i < 9; i++) {
        const [x, y] = iso(o.x + 0.25 + (i % 3) * 0.25, o.y + 0.25 + Math.floor(i / 3) * 0.25);
        ctx.strokeStyle = '#4c8f37'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - 7); ctx.stroke();
        ctx.fillStyle = cols[i % cols.length];
        ctx.beginPath(); ctx.arc(x, y - 8, 3, 0, Math.PI * 2); ctx.fill();
      }
      break;
    }
    case 'lavicka': {
      const a = iso(o.x + 0.2, o.y + 0.5), b = iso(o.x + 0.8, o.y + 0.5);
      ctx.strokeStyle = '#5b3a1e'; ctx.lineWidth = 3;
      for (const p of [a, b]) { ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(p[0], p[1] - 10); ctx.stroke(); }
      ctx.strokeStyle = '#a7703d'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(a[0], a[1] - 10); ctx.lineTo(b[0], b[1] - 10); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(a[0] + 3, a[1] - 20); ctx.lineTo(b[0] + 3, b[1] - 20); ctx.stroke();
      break;
    }
    case 'jablon':
      ctx.fillStyle = '#7a4e2a'; ctx.fillRect(cx - 3, cy - 22, 6, 22);
      ctx.fillStyle = '#3f8f3a'; ctx.beginPath(); ctx.arc(cx, cy - 32, 17, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#52a862'; ctx.beginPath(); ctx.arc(cx - 5, cy - 37, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#d9342b';
      for (const [dx, dy] of [[-8, -28], [6, -36], [9, -24], [-2, -42], [0, -26]]) { ctx.beginPath(); ctx.arc(cx + dx, cy + dy, 2.6, 0, Math.PI * 2); ctx.fill(); }
      break;
    case 'fontana': {
      ctx.fillStyle = '#9aa3ab'; ctx.beginPath(); ctx.ellipse(cx, cy - 4, 22, 11, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#5fb3e6'; ctx.beginPath(); ctx.ellipse(cx, cy - 6, 17, 8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#b8c0c7'; ctx.fillRect(cx - 3, cy - 22, 6, 16);
      for (let i = 0; i < 6; i++) {
        const k = ((t / 900 + i / 6) % 1);
        const ang = i * Math.PI / 3;
        ctx.fillStyle = `rgba(200,235,255,${1 - k})`;
        ctx.beginPath(); ctx.arc(cx + Math.cos(ang) * k * 12, cy - 24 - Math.sin(k * Math.PI) * 10 + k * 14, 2, 0, Math.PI * 2); ctx.fill();
      }
      break;
    }
  }
}

function objectDepth(o) {
  const d = objSize(o);
  if (o.kind === 'velkepole' || o.kind === 'rybnik') return o.x + o.y + 1;   // leží na zemi – kreslit brzy
  return o.x + o.y + (d.w + d.h) / 2;
}

// ---------- stodola, prodejna, stánek ----------
function drawGarage(ctx, o, d, now, t, farm) {
  const lerp = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
  const h = house(ctx, o.x + 0.1, o.y + 0.15, o.x + d.w - 0.1, o.y + d.h - 0.1, 44, 30, '#a8483a', '#6f3a2a');
  // velká vrata na levé (přední) stěně
  const g0 = lerp(h.W, h.S, 0.18), g1 = lerp(h.W, h.S, 0.82);
  poly(ctx, [g0, g1, [g1[0], g1[1] - 34], [g0[0], g0[1] - 34]], '#5b3a1e');
  ctx.strokeStyle = '#f3e3c3'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(g0[0], g0[1]); ctx.lineTo(g1[0], g1[1] - 34); ctx.moveTo(g1[0], g1[1]); ctx.lineTo(g0[0], g0[1] - 34); ctx.stroke();
  // zaparkované stroje před stodolou (ty, co zrovna nepracují)
  if (farm) {
    const idle = farm.machines.filter(m => isVehicle(m.model) && !farm.objects.some(x => x.job && x.job.m === m.id && now < x.job.end));
    idle.slice(0, 3).forEach((m, i) => {
      const [vx, vy] = iso(o.x + 0.5 + i * 0.9, o.y + d.h + 0.35);
      drawVehicle(ctx, vx, vy, m.model, 1, t, 0.5, false);
    });
  }
}

function drawDealer(ctx, o, d, now, t) {
  const lerp = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
  const h = house(ctx, o.x + 0.2, o.y + 0.15, o.x + d.w - 0.15, o.y + d.h - 0.5, 40, 18, '#e8e2d6', '#3f6fb5');
  // výloha a markýza
  const w0 = lerp(h.W, h.S, 0.12), w1 = lerp(h.W, h.S, 0.88);
  poly(ctx, [[w0[0], w0[1] - 8], [w1[0], w1[1] - 8], [w1[0], w1[1] - 28], [w0[0], w0[1] - 28]], '#9fd0f0');
  for (let k = 0; k < 6; k++) {
    const a = lerp(w0, w1, k / 6), b = lerp(w0, w1, (k + 1) / 6);
    poly(ctx, [[a[0], a[1] - 30], [b[0], b[1] - 30], [b[0] + 3, b[1] - 24], [a[0] + 3, a[1] - 24]], k % 2 ? '#fff' : '#c8452d');
  }
  drawIcon(ctx, 'shop', h.apex[0], h.apex[1] + 14, 18);
  const [vx, vy] = iso(o.x + d.w * 0.55, o.y + d.h - 0.3);
  drawVehicle(ctx, vx, vy, 'brazda60', 1, t, 0.48, false);
}

function drawStall(ctx, o, d, now, t) {
  const [cx, cy] = iso(o.x + d.w / 2, o.y + d.h / 2);
  ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.beginPath(); ctx.ellipse(cx, cy + 6, 40, 16, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#7a4e2a';
  for (const dx of [-30, 30]) ctx.fillRect(cx + dx - 2, cy - 44, 4, 46);
  ctx.fillStyle = '#a7703d'; ctx.fillRect(cx - 34, cy - 14, 68, 14);       // pult
  ctx.fillStyle = '#8a5a35'; ctx.fillRect(cx - 34, cy - 14, 68, 3);
  const goods = ['#e0402d', '#f2c22e', '#5fae3a', '#f08a24', '#6b2f7a', '#d9342b'];
  goods.forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(cx - 26 + i * 10.5, cy - 17, 4, 0, Math.PI * 2); ctx.fill(); });
  for (let k = 0; k < 6; k++) {                                              // pruhovaná stříška
    ctx.fillStyle = k % 2 ? '#fff' : '#4f8fd6';
    ctx.beginPath(); ctx.moveTo(cx - 38 + k * 12.7, cy - 44); ctx.lineTo(cx - 25.3 + k * 12.7, cy - 44); ctx.lineTo(cx - 25.3 + k * 12.7 + 2, cy - 34); ctx.lineTo(cx - 38 + k * 12.7 + 2, cy - 34); ctx.fill();
  }
  ctx.fillStyle = '#3f6fb5'; ctx.fillRect(cx - 38, cy - 50, 78, 6);
}

// tržiště hráčů: několik stánků s různými stříškami a zbožím
function miniStall(ctx, cx, cy, awn, goods, t, k) {
  ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.beginPath(); ctx.ellipse(cx, cy + 4, 30, 12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#7a4e2a';
  for (const dx of [-22, 22]) ctx.fillRect(cx + dx - 2, cy - 36, 4, 38);
  ctx.fillStyle = '#a7703d'; ctx.fillRect(cx - 26, cy - 12, 52, 12);
  ctx.fillStyle = '#8a5a35'; ctx.fillRect(cx - 26, cy - 12, 52, 3);
  goods.forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(cx - 18 + i * 9, cy - 15, 3.6, 0, Math.PI * 2); ctx.fill(); });
  const flap = Math.sin(t / 700 + k) * 1.2;
  for (let i = 0; i < 5; i++) {
    ctx.fillStyle = i % 2 ? '#fff' : awn;
    ctx.beginPath(); ctx.moveTo(cx - 29 + i * 11.6, cy - 36); ctx.lineTo(cx - 17.4 + i * 11.6, cy - 36); ctx.lineTo(cx - 15.4 + i * 11.6, cy - 27 + flap); ctx.lineTo(cx - 27 + i * 11.6, cy - 27 + flap); ctx.fill();
  }
  ctx.fillStyle = awn; ctx.fillRect(cx - 30, cy - 41, 61, 5);
}
function drawMarket(ctx, o, d, now, t) {
  const spots = [[0.75, 0.75, '#c8452d', ['#f2c22e', '#e0402d', '#5fae3a', '#f08a24', '#d9a05b']], [2.3, 0.85, '#5fae3a', ['#d9342b', '#c9c23a', '#5b3f8f', '#f2a03d', '#e0283c']],
    [0.85, 2.3, '#4f8fd6', ['#e9f2f5', '#f5c542', '#b5122b', '#8fd45a', '#d9a05b']], [2.3, 2.3, '#d9b43b', ['#8a8f96', '#c8452d', '#4f8fd6', '#a7703d', '#f3e3c3']]];
  spots.forEach(([gx, gy, awn, goods], k) => {
    const [x, y] = iso(o.x + gx, o.y + gy);
    ctx.save(); ctx.translate(x, y); ctx.scale(1.35, 1.35);
    miniStall(ctx, 0, 0, awn, goods, t, k);
    ctx.restore();
  });
  // cedule s ikonou
  const [sx, sy] = iso(o.x + 1.5, o.y + 1.5);
  ctx.fillStyle = '#7a4e2a'; ctx.fillRect(sx - 2, sy - 54, 4, 54);
  ctx.fillStyle = '#f3e3c3'; ctx.strokeStyle = '#8a5a35'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.rect(sx - 18, sy - 76, 36, 26); ctx.fill(); ctx.stroke();
  drawIcon(ctx, 'market', sx, sy - 63, 20);
}

// ---------- rybník ----------
function drawPond(ctx, o, d, now, t) {
  const c = iso(o.x + 1.5, o.y + 1.5);
  const ell = (rx, ry, fill) => { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(c[0], c[1], rx, ry, 0, 0, Math.PI * 2); ctx.fill(); };
  ell(136, 64, '#c9b38a');                 // písčitý břeh
  ell(124, 57, '#3f78b8');
  ell(104, 46, '#4f8fd6');
  ctx.strokeStyle = 'rgba(220,240,255,0.6)'; ctx.lineWidth = 2;   // vlnky
  for (let i = 0; i < 3; i++) {
    const k = ((t / 2600 + i / 3) % 1);
    ctx.globalAlpha = 1 - k;
    ctx.beginPath(); ctx.ellipse(c[0] - 30 + i * 30, c[1] - 6 + i * 8, 8 + k * 22, 3 + k * 9, 0, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const [dx, dy] of [[-62, 14], [52, -18], [70, 16]]) {         // lekníny
    ctx.fillStyle = '#5fae3a'; ctx.beginPath(); ctx.ellipse(c[0] + dx, c[1] + dy, 11, 5, 0, 0.3, Math.PI * 2); ctx.lineTo(c[0] + dx, c[1] + dy); ctx.fill();
    if (dx > 60) { ctx.fillStyle = '#f5a0c0'; ctx.beginPath(); ctx.arc(c[0] + dx + 2, c[1] + dy - 3, 3.2, 0, Math.PI * 2); ctx.fill(); }
  }
  // rákos na kraji
  ctx.strokeStyle = '#5f8a3a'; ctx.lineWidth = 2.2;
  for (const [dx, dy, h] of [[-118, -4, 30], [-112, 4, 36], [-104, -10, 26], [108, 20, 32], [116, 12, 26]]) {
    const sw = Math.sin(t / 900 + dx) * 2;
    ctx.beginPath(); ctx.moveTo(c[0] + dx, c[1] + dy); ctx.lineTo(c[0] + dx + sw, c[1] + dy - h); ctx.stroke();
    ctx.fillStyle = '#7a4e2a'; ctx.beginPath(); ctx.ellipse(c[0] + dx + sw, c[1] + dy - h, 2.2, 6, 0, 0, Math.PI * 2); ctx.fill();
  }
  // ryba občas vyskočí
  const cyc = (t / 4200 + o.id * 0.37) % 1;
  if (cyc < 0.12) {
    const k = cyc / 0.12;
    const fx = c[0] - 20 + k * 40, fy = c[1] - Math.sin(k * Math.PI) * 26;
    ctx.fillStyle = '#c9a24a'; ctx.beginPath(); ctx.ellipse(fx, fy, 8, 3.4, (k - 0.5) * 1.6, 0, Math.PI * 2); ctx.fill();
  }
  // malé molo
  const m0 = iso(o.x + 2.3, o.y + 2.9), m1 = iso(o.x + 2.9, o.y + 2.9), m2 = iso(o.x + 2.9, o.y + 2.0), m3 = iso(o.x + 2.3, o.y + 2.0);
  poly(ctx, [m0, m1, m2, m3], '#a7703d');
  ctx.strokeStyle = '#7a4e2a'; ctx.lineWidth = 1.2;
  for (let k = 1; k < 4; k++) { const a = [m0[0] + (m3[0] - m0[0]) * k / 4, m0[1] + (m3[1] - m0[1]) * k / 4], b = [m1[0] + (m2[0] - m1[0]) * k / 4, m1[1] + (m2[1] - m1[1]) * k / 4]; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
  const s = pondStock(o, now);
  if (s.count) bubble(ctx, c[0], c[1] - 70 + Math.sin(t / 300) * 2, 'kapr', s.count, s.count < s.cap);
}

// ---------- včelín: úly a poletující včely ----------
function drawHive(ctx, o, d, now, t, farm) {
  const box = (gx, gy, col) => {
    const [x, y] = iso(gx, gy);
    ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.beginPath(); ctx.ellipse(x, y + 2, 18, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#7a4e2a'; ctx.fillRect(x - 15, y - 6, 4, 8); ctx.fillRect(x + 11, y - 6, 4, 8);
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i % 2 ? shade(col, 0.88) : col;
      ctx.fillRect(x - 16, y - 18 - i * 11, 32, 12);
    }
    ctx.fillStyle = '#8a5a35'; ctx.beginPath(); ctx.moveTo(x - 20, y - 40); ctx.lineTo(x, y - 52); ctx.lineTo(x + 20, y - 40); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#4a3218'; ctx.fillRect(x - 5, y - 10, 10, 3);
    return [x, y - 30];
  };
  const hives = [box(o.x + 0.6, o.y + 0.7, '#f2d07a'), box(o.x + 1.45, o.y + 1.4, '#9fd0f0')];
  // květiny kolem
  for (const [gx, gy, c] of [[0.3, 1.6, '#e0402d'], [0.5, 1.8, '#f5c542'], [1.7, 0.4, '#d6335a'], [1.9, 0.6, '#ffffff']]) {
    const [x, y] = iso(o.x + gx, o.y + gy);
    ctx.fillStyle = '#4fa63c'; ctx.fillRect(x - 0.8, y - 7, 1.6, 7);
    ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y - 8, 3, 0, Math.PI * 2); ctx.fill();
  }
  // včely
  for (let i = 0; i < 6; i++) {
    const [hx, hy] = hives[i % 2];
    const a = t / (600 + i * 90) + i * 1.7;
    const bx = hx + Math.cos(a) * (16 + i * 3), by = hy - 8 + Math.sin(a * 1.3) * (8 + i);
    ctx.fillStyle = '#f5c542'; ctx.beginPath(); ctx.ellipse(bx, by, 2.6, 1.8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2f2a26'; ctx.fillRect(bx - 0.5, by - 1.8, 1, 3.6);
    ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.beginPath(); ctx.ellipse(bx, by - 2.4, 1.6, 1, 0, 0, Math.PI * 2); ctx.fill();
  }
  const st = objectStatus(o, now, farm);
  if (st.done) { const [x, y] = iso(o.x + 1, o.y + 1); bubble(ctx, x, y - 78 + Math.sin(t / 300) * 2, 'plast', st.done); }
}

// ozdobný domek v městečku
function drawTownHouse(ctx, gx, gy, wall, roof) {
  const lerp = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
  const h = house(ctx, gx + 0.2, gy + 0.2, gx + 1.8, gy + 1.8, 40, 30, wall, roof);
  const d0 = lerp(h.W, h.S, 0.55), d1 = lerp(h.W, h.S, 0.75);
  poly(ctx, [d0, d1, [d1[0], d1[1] - 24], [d0[0], d0[1] - 24]], '#6b3f1f');
  for (const [a, b, k] of [[h.W, h.S, 0.25], [h.S, h.E, 0.5]]) {
    const w0 = lerp(a, b, k - 0.1), w1 = lerp(a, b, k + 0.1);
    poly(ctx, [[w0[0], w0[1] - 18], [w1[0], w1[1] - 18], [w1[0], w1[1] - 32], [w0[0], w0[1] - 32]], '#fdf3c4');
  }
}

// cedulka s úrovní budovy
function levelPlate(ctx, o, d) {
  const L = objLevel(o);
  if (L < 2) return;
  const sz = { w: o.w || d.w, h: o.h || d.h };
  const [x, y] = iso(o.x + sz.w, o.y + sz.h / 2);
  ctx.fillStyle = '#4f8fd6'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x - 6, y - 10, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = '800 10px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(String(L), x - 6, y - 9.5);
  ctx.textBaseline = 'alphabetic';
}

// panáček: farmář nebo pomocník; walking = jde, work = pracuje
function drawPerson(ctx, x, y, shirt, hat, t, walking, work) {
  const step = walking ? Math.sin(t / 90) : 0;
  const bend = work ? Math.abs(Math.sin(t / 120)) * 3 : 0;
  ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(x, y, 6, 2.6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#2f4f8f'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x - 1.5, y - 9); ctx.lineTo(x - 2 - step * 2, y - 1); ctx.moveTo(x + 1.5, y - 9); ctx.lineTo(x + 2 + step * 2, y - 1); ctx.stroke();
  ctx.fillStyle = shirt; ctx.fillRect(x - 4, y - 18 + bend, 8, 10);
  ctx.strokeStyle = shirt; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(x - 4, y - 16 + bend); ctx.lineTo(x - 6 + step * 2, y - 10 + bend + (work ? 3 : 0)); ctx.moveTo(x + 4, y - 16 + bend); ctx.lineTo(x + 6 - step * 2, y - 10 + bend + (work ? 3 : 0)); ctx.stroke();
  ctx.fillStyle = '#f2c9a0'; ctx.beginPath(); ctx.arc(x, y - 21 + bend, 3.6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = hat; ctx.beginPath(); ctx.ellipse(x, y - 24 + bend, 6, 1.8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillRect(x - 3, y - 27 + bend, 6, 3);
  ctx.lineCap = 'butt';
}

function drawObject(ctx, o, now, t, farm) {
  const d = BUILDINGS[o.kind];
  if (d.type === 'garage') { drawGarage(ctx, o, d, now, t, farm); levelPlate(ctx, o, d); return; }
  if (d.type === 'dealer') { drawDealer(ctx, o, d, now, t); levelPlate(ctx, o, d); return; }
  if (d.type === 'stall') {
    const [cx, cy] = iso(o.x + d.w / 2, o.y + d.h / 2);
    ctx.save(); ctx.translate(cx, cy); ctx.scale(1.5, 1.5); ctx.translate(-cx, -cy);
    drawStall(ctx, o, d, now, t);
    ctx.restore(); levelPlate(ctx, o, d); return;
  }
  if (d.type === 'market') { drawMarket(ctx, o, d, now, t); return; }
  if (d.type === 'pond') { drawPond(ctx, o, d, now, t); levelPlate(ctx, o, d); return; }
  if (d.type === 'hive') { drawHive(ctx, o, d, now, t, farm); levelPlate(ctx, o, d); return; }
  if (d.type === 'factory') drawFactory(ctx, o, d, now, t);
  else if (d.type === 'pen') drawPen(ctx, o, d, now, t);
  else if (d.type === 'main') drawMain(ctx, o, d, now, t, farm);
  else if (d.type === 'orchard') drawOrchard(ctx, o, d, now, t);
  else if (d.type === 'storage') drawStorage(ctx, o, d, now, t);
  else if (d.type === 'bigfield') drawBigField(ctx, o, d, now, t, farm);
  else drawDeco(ctx, o, d, now, t);
  if (UPGRADABLE.includes(d.type)) levelPlate(ctx, o, d);
}

// duch při stavění/přesunu: ghost = { kind, x, y, ok }
function drawGhost(ctx, g, now, t) {
  const d = g.kind === 'plot' ? { w: 1, h: 1 } : g.w ? { w: g.w, h: g.h } : BUILDINGS[g.kind];
  const N = iso(g.x, g.y), E = iso(g.x + d.w, g.y), S = iso(g.x + d.w, g.y + d.h), W = iso(g.x, g.y + d.h);
  poly(ctx, [N, E, S, W], g.ok ? 'rgba(120,230,110,0.45)' : 'rgba(230,80,60,0.45)');
  ctx.strokeStyle = g.ok ? '#e9ffe0' : '#ffd6cf'; ctx.lineWidth = 2;
  ctx.stroke();
  if (g.kind !== 'plot') {
    ctx.save();
    ctx.globalAlpha = 0.7;
    drawObject(ctx, { kind: g.kind, x: g.x, y: g.y, w: g.w, h: g.h, queue: [], animals: [], job: null }, now, t);
    ctx.restore();
  }
}

// ---- public/js/panels.js ----
// EKOfarm – obsah panelů (obchod, budova, ohrada, sklad). Vrací HTML; kliknutí obsluhuje main.js přes data-act.




const FRUITS_OF = it => !!TREE_LIST.find(t => t.fruit === it.id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function card({ icon, name, lines, locked, act, v, disabled }) {
  const cls = 'crop' + (locked ? ' locked' : '') + (disabled ? ' dim' : '');
  return `<button class="${cls}" data-act="${act}" data-v="${esc(v)}">
    <div class="ico">:${icon}:</div><div class="nm">${esc(name)}</div>
    ${lines.map(l => `<div class="meta">${l}</div>`).join('')}
  </button>`;
}

const SHOP_TABS = [['zvirata', 'Zvířata'], ['farma', 'Farma']];

const TYPE_ORDER = { storage: 0, garage: 1, factory: 2, pen: 3, pond: 3, hive: 3, deco: 4 };
const nextSt = farm => `víc se statkem ${statekLevel(farm) + 1}`;

function fieldCards(farm) {
  const max = maxPlots(farm);
  const free = farm.plots.length < FREE_PLOTS;
  const plot = card({ icon: 'plot', name: 'Pole', act: 'buyPlot', v: 'plot', disabled: farm.plots.length >= max || farm.coins < plotPrice(farm),
    lines: farm.plots.length >= max ? [`${farm.plots.length}/${max}`, nextSt(farm)]
      : [free ? `:gift: zdarma (${FREE_PLOTS - farm.plots.length}×)` : `${plotPrice(farm)} :coin:`, `${farm.plots.length}/${max} polí`] });
  const sadMax = maxOrchards(farm);
  const sadCount = countKind(farm, 'sad');
  const sad = card({ icon: 'tree', name: 'Sad', act: 'buy', v: 'sad',
    disabled: sadCount >= sadMax || farm.coins < orchardPrice(farm),
    lines: sadCount >= sadMax ? [`${sadCount}/${sadMax}`, nextSt(farm)]
      : [`${orchardPrice(farm)} :coin:`, `${sadCount}/${sadMax} sadů`] });
  const bfMax = maxBigFields(farm), bfCount = countKind(farm, 'velkepole');
  const bfLock = BUILDINGS.velkepole.st > statekLevel(farm);
  const big = card({ icon: 'field', name: 'Velké pole', act: 'buy', v: 'velkepole', locked: bfLock,
    disabled: !bfLock && bfCount >= bfMax,
    lines: bfLock ? [`:lock: statek úr. ${BUILDINGS.velkepole.st}`, 'pro stroje']
      : bfCount >= bfMax ? [`${bfCount}/${bfMax}`, nextSt(farm)]
      : [`${FIELD_CELL_PRICE} :coin: za políčko`, `${FIELD_MIN}×${FIELD_MIN} až ${FIELD_MAX}×${FIELD_MAX}`] });
  const left = LAND_PARCELS.filter(p => !farm.land.includes(p.id)).length;
  const land = card({ icon: 'sign', name: 'Pozemky', act: 'openLand', v: '', disabled: !left,
    lines: left ? [`další za ${landPrice(farm)} :coin:`, `od úrovně ${landLevel(farm)}`] : ['vše koupeno', '&nbsp;'] });
  return [plot, sad, big, land];
}

// Stavět: všechny budovy, odemčené i zamčené (odemyká je jen úroveň Statku)
function buildHtml(farm) {
  const fields = fieldCards(farm);
  const list = BUILDING_LIST.filter(b => b.type in TYPE_ORDER)
    .sort((a, b) => a.st - b.st || TYPE_ORDER[a.type] - TYPE_ORDER[b.type] || a.cost - b.cost);
  const cards = list.map(b => {
    const free = farm.pending.includes(b.id);
    const locked = !free && b.st > statekLevel(farm);
    const done = !free && b.max && countKind(farm, b.id) >= b.max;
    const lines = free ? [':gift: zdarma', `${b.w}×${b.h}`]
      : locked ? [`:lock: statek úr. ${b.st}`, `${b.cost} :coin:`]
      : done ? ['✓ postaveno', '&nbsp;']
      : [`${b.cost} :coin:`, `${b.w}×${b.h}`];
    return card({ icon: b.icon, name: b.name, locked, act: 'buy', v: b.id, disabled: done || (!free && farm.coins < b.cost), lines });
  });
  return `<p class="muted">Statek úrovně <b>${statekLevel(farm)}</b>. Každé vylepšení Statku odemkne nové budovy a víc polí a sadů. Stroje a stánek najdeš dole v <b>městečku</b>.</p><div class="crops">${fields.join('')}${cards.join('')}</div>`;
}

function shopHtml(farm, tab) {
  const tabs = `<div class="tabs">${SHOP_TABS.map(([id, n]) => `<button class="tab${id === tab ? ' on' : ''}" data-act="tab" data-v="${id}">${n}</button>`).join('')}</div>`;
  let cards = [];
  if (tab === 'zvirata') {
    cards = ANIMAL_LIST.map(a => {
      const locked = farm.level < a.level;
      const homes = farm.objects.filter(o => o.kind === a.home);
      const count = homes.reduce((n, o) => n + o.animals.length, 0);
      const cap = homes.length * a.max;
      const lines = locked ? [`:lock: úroveň ${a.level}`]
        : !homes.length ? [`${a.cost} :coin:`, `potřebuje ${BUILDINGS[a.home].name}`]
        : [`${a.cost} :coin:`, `${count}/${cap} v ohradě`];
      return card({ icon: a.icon, name: a.name, locked, act: 'buyAnimal', v: a.id, disabled: !homes.length || count >= cap || farm.coins < a.cost, lines });
    });
  } else {
    const max = maxPlots(farm);
    cards = [
      card({ icon: 'plot', name: 'Pole', act: 'buyPlot', v: 'plot', disabled: farm.plots.length >= max,
        lines: farm.plots.length >= max ? [`${farm.plots.length}/${max} · ${nextSt(farm)}`] : [`${plotPrice(farm)} :coin:`, `${farm.plots.length}/${max} polí`] }),
      false && card({ icon: 'barn', name: 'Větší sklad', act: 'upgradeSilo', v: '', disabled: farm.coins < siloUpgradePrice(farm),
        lines: [`${siloUpgradePrice(farm)} :coin:`, `${farm.siloCap} → ${farm.siloCap + 25} míst`] }),
    ];
  }
  return tabs + `<div class="crops">${cards.join('')}</div>`;
}

function orderCard(farm, o, i, now) {
  if (!orderReady(o, now)) {
    return `<div class="order wait"><div class="ico">:truck:</div><small>Nová zakázka za<br><b>${fmtTime(Math.ceil((o.readyAt - now) / 1000))}</b></small></div>`;
  }
  const ok = canDeliver(farm, o);
  const items = o.items.map(x => `<span class="${have(farm, x.item) >= x.qty ? 'okq' : 'miss'}">:${ITEMS[x.item].icon}:<b>${have(farm, x.item)}/${x.qty}</b></span>`).join('');
  return `<div class="order${ok ? ' ready' : ''}">
    <button class="del" data-act="discard" data-v="${i}" aria-label="Zrušit zakázku">✕</button>
    <div class="items">${items}</div>
    <div class="rew">${o.coins} :coin: · ${o.xp} :xp:</div>
    <button class="btn sm${ok ? '' : ' off'}" data-act="deliver" data-v="${i}">Doručit</button>
  </div>`;
}

// blok „Vylepšit budovu“ – suroviny, mince, co to přinese
function upgradeBlock(farm, o) {
  const L = objLevel(o);
  const c = upgradeCost(o);
  if (!c) return `<div class="upg"><b>:star: Úroveň ${L}/${MAX_BLD_LEVEL}</b> – nejvyšší úroveň.</div>`;
  const items = c.items.map(x => `<span class="${have(farm, x.item) >= x.qty ? 'okq' : 'miss'}">:${ITEMS[x.item].icon}:${have(farm, x.item)}/${x.qty}</span>`).join(' ');
  const coinOk = farm.coins >= c.coins;
  const lock = BUILDINGS[o.kind].type !== 'main' && c.level > statekLevel(farm) ? ':lock: nejdřív vylepši Statek' : '';
  const ok = !lock && coinOk && c.items.every(x => have(farm, x.item) >= x.qty);
  return `<div class="upg"><b>:star: Úroveň ${L}/${MAX_BLD_LEVEL}</b> → ${c.level}: ${upgradeEffect(o)}
    <div class="need">${items} <span class="${coinOk ? 'okq' : 'miss'}">:coin:${c.coins}</span></div>
    ${lock ? `<small>${lock}</small>` : ''}
    <button class="btn sm${ok ? '' : ' off'}" data-act="upgrade" data-v="${o.id}"${o.town ? ' data-town="1"' : ''}>Vylepšit</button></div>`;
}

const STATEK_TABS = [['zakazky', 'Zakázky'], ['pomocnik', 'Pomocník'], ['statek', 'Statek']];

function statekHtml(farm, name, now, tab = 'zakazky', o) {
  const tabs = `<div class="tabs">${STATEK_TABS.map(([id, n]) => `<button class="tab${id === tab ? ' on' : ''}" data-act="stab" data-v="${id}">${n}</button>`).join('')}</div>`;
  if (tab === 'pomocnik') return tabs + helperHtml(farm, now);
  if (tab === 'statek') {
    const next = farm.level < MAX_LEVEL ? LEVEL_XP[farm.level + 1] - farm.xp : 0;
    const L = statekLevel(farm);
    const unlocks = BUILDING_LIST.filter(b => b.st === L + 1).map(b => `:${b.icon}: ${b.name}`).join(', ');
    const have1 = BUILDING_LIST.filter(b => b.st && b.st <= L).map(b => `:${b.icon}:`).join('');
    return tabs + `<p class="muted">Farma ${esc(name)} · hráč úrovně <b>${farm.level}</b> · ${farm.xp} XP${next ? ` (do další ${next})` : ''}. Úroveň hráče roste pořád; co můžeš <b>stavět</b>, určuje Statek.</p>
      <p class="muted">Statek ${L}: až ${maxPlots(farm)} polí, ${maxOrchards(farm)} sadů, ${maxBigFields(farm)}× velké pole. Odemčeno: ${have1}</p>
      ${unlocks ? `<p class="muted">Statek úrovně ${L + 1} odemkne: <b>${unlocks}</b></p>` : ''}
      ${upgradeBlock(farm, o)}`;
  }
  return tabs + `<p class="muted"><b>:truck: Zakázky</b> – doruč zboží a dostaneš nejvíc mincí. Zakázku, která se ti nehodí, zruš ✕ a za 3 minuty přijde nová.</p>
    <div class="orders">${farm.orders.map((x, i) => orderCard(farm, x, i, now)).join('')}</div>`;
}

// najímání pomocníka
function helperHtml(farm, now) {
  const h = farm.helper;
  const active = helperActive(farm, now);
  const cropOpts = CROP_LIST.filter(c => c.level <= farm.level).map(c =>
    `<button class="chip${h && h.crop === c.id ? ' on' : ''}" data-act="helperCrop" data-v="${c.id}">:${c.icon}: ${c.name}</button>`).join('');
  if (farm.level < HELPER_LEVEL) return `<div class="empty">:lock: Pomocníka si najmeš od úrovně ${HELPER_LEVEL}.</div>`;
  const plans = HELPER_PLANS.map((p, i) => `<button class="btn sm" data-act="hire" data-v="${i}">${active ? 'Prodloužit' : 'Najmout'} na ${p.h} h · ${p.cost} :coin:</button>`).join(' ');
  const tools = `Pracuje každých ${helperInterval(farm)} s, najednou obslouží ${helperCapacity(farm)} políčka.` +
    (farm.machines.some(m => m.model === 'kolecko') ? '' : ' :kolecko: Kolečko z prodejny strojů přidá 2 políčka.') +
    (farm.machines.some(m => m.model === 'motyka') ? '' : ' :motyka: Motyka zrychlí práci 2×.');
  const tractor = hasMachine(farm, 'tractor')
    ? `<button class="chip${h && h.tractor ? ' on' : ''}" data-act="helperTractor" data-v="${h && h.tractor ? 0 : 1}">:tractor: Jezdí traktorem (+3 políčka)</button>` : '';
  const status = active
    ? `<div class="row"><span class="ico">:helper:</span><div class="info"><b>Pomocník pracuje</b><small>ještě ${fmtTime(Math.ceil((h.until - now) / 1000))} · hotovo ${h.n || 0} prací</small></div></div>`
    : `<p class="muted">:helper: Pomocník sám sklízí zralá malá pole a zasívá prázdná vybranou plodinou (bere semena ze skladu, jinak platíš mincemi). Úroda jde do skladu.</p>`;
  return `${status}<p class="muted"><b>Co má sít:</b></p><div class="chips">${cropOpts}</div>${tractor ? `<div class="chips">${tractor}</div>` : ''}
    <p class="muted">${tools}</p><div class="hire">${plans}</div>`;
}

function orchardHtml(farm, o, now) {
  const st = treeState(o, now);
  if (st.state === 'empty') {
    const cards = [...TREE_LIST].sort((a, b) => (a.kind === b.kind ? 0 : a.kind === 'bush' ? -1 : 1) || a.level - b.level).map(t => {
      const locked = farm.level < t.level;
      const sap = have(farm, 'z_' + t.id);
      return card({ icon: ITEMS[t.fruit].icon, name: t.name, locked, act: 'plantTree', v: t.id, disabled: !locked && !sap && farm.coins < t.cost,
        lines: locked ? [`:lock: úroveň ${t.level}`] : [sap ? `:z_${t.id}: sazenice ze skladu (${sap})` : `sazenice ${t.cost} :coin:`, `${t.harvests}× ${t.yield} :${ITEMS[t.fruit].icon}: · první za ${fmtTime(t.first)}`] });
    });
    return `<p class="muted">Vyber strom. Plodí několikrát, pak doslouží a vykopeš ho.</p><div class="crops">${cards.join('')}</div>
      <button class="btn alt" data-act="move" data-v="${o.id}">↔ Přesunout sad</button>`;
  }
  const t = TREES[o.tree];
  const fruit = ITEMS[t.fruit];
  let txt;
  if (st.state === 'dead') txt = 'Strom doplodil. Vykopej ho a zasaď nový.';
  else if (st.state === 'ready') txt = `${t.yield}× :${fruit.icon}: je zralé – klepni na strom.`;
  else txt = `:${fruit.icon}: za ${fmtTime(st.left)}`;
  const bar = st.state === 'growing' ? `<div class="bar"><div style="width:${(st.progress * 100).toFixed(1)}%"></div></div>` : '';
  return `<div class="row"><span class="ico">:${fruit.icon}:</span><div class="info"><b>${t.name}</b><small>${txt}</small>${bar}
      <small>Zbývá úrod: ${st.state === 'dead' ? 0 : o.left} z ${t.harvests} · ${fruit.price} :coin: za kus</small></div></div>
    ${st.state === 'dead' ? `<button class="btn" data-act="clearTree" data-v="${o.id}">:axe: Vykopat strom</button>` : ''}
    <button class="btn alt" data-act="move" data-v="${o.id}">↔ Přesunout sad</button>`;
}

// cena osiva pro n políček: semena ze skladu + zbytek v mincích
function seedCost(farm, c, n) {
  const s = Math.min(n, have(farm, 's_' + c.id));
  return (s ? `${s}× :s_${c.id}:` : '') + (n - s ? `${s ? ' + ' : ''}${(n - s) * c.cost} :coin:` : '');
}

// prodejna strojů v městečku
function dealerHtml(farm, now, o) {
  const slots = garageSlots(farm), used = vehicleCount(farm);
  const cards = MACHINE_LIST.map(m => {
    const locked = farm.level < m.level;
    const mine = farm.machines.find(x => x.model === m.id);
    const job = mine && machineJob(farm, mine.id, now);
    const price = machinePrice(farm, m.id);
    const noRoom = isVehicle(m.id) && used >= slots;
    const lines = locked ? [`:lock: úroveň ${m.level}`]
      : mine ? [job ? `:gear: pracuje ${fmtTime(Math.ceil((job.job.end - now) / 1000))}` : isVehicle(m.id) ? '✓ ve stodole' : '✓ koupeno']
      : noRoom ? [`${price} :coin:`, slots ? 'stodola je plná' : 'potřebuje stodolu'] : [`${price} :coin:`];
    if (m.speed) lines.push(`${m.speed} políček/min`);
    lines.push(`<small>${m.info}</small>`);
    return card({ icon: m.icon, name: m.name, locked, act: 'buyMachine', v: m.id, disabled: !!mine || noRoom || farm.coins < price, lines });
  });
  let small = '';
  if (hasMachine(farm, 'tractor') || hasMachine(farm, 'combine')) {
    const empty = farm.plots.filter(p => !p.crop).length;
    const ready = farm.plots.filter(p => plotState(p, now).state === 'ready').length;
    small = `<p class="muted"><b>Malá pole</b> – stroje je obslouží najednou.</p>`;
    if (hasMachine(farm, 'tractor')) {
      small += `<div class="crops">${CROP_LIST.filter(c => c.level <= farm.level).map(c => card({ icon: c.icon, name: `Zasít: ${c.name}`, act: 'sowAll', v: c.id, disabled: !empty,
        lines: [seedCost(farm, c, empty)] })).join('')}</div>`;
    }
    if (hasMachine(farm, 'combine')) small += ready ? `<button class="btn" data-act="harvestAll" data-v="">Sklidit všechna zralá malá pole (${ready})</button>` : '';
  }
  return `<p class="muted">Traktory a kombajny parkují ve <b>stodole</b> (${used}/${slots} míst). Náčiní místo nepotřebuje. Stroje pracují na velkých polích.</p>
    <div class="crops">${cards.join('')}</div>${small}${o ? upgradeBlock(farm, o) : ''}`;
}

// stodola: zaparkované stroje, prodej
function garageHtml(farm, o, now) {
  const slots = garageSlots(farm);
  const rows = farm.machines.map(m => {
    const d = MACHINES[m.model];
    const job = machineJob(farm, m.id, now);
    return `<div class="row"><span class="ico">:${d.icon}:</span><div class="info"><b>${d.name}</b><small>${isVehicle(m.model) ? (job ? 'pracuje na poli' : 'zaparkováno') : 'náčiní'}</small></div>
      <button class="btn sm alt" data-act="sellMachine" data-v="${m.id}"${job ? ' disabled' : ''}>Prodat za ${Math.round(d.cost * 0.5)} :coin:</button></div>`;
  }).join('') || '<div class="empty">Stodola je prázdná. Stroje koupíš v Prodejně strojů.</div>';
  return `<p class="muted">Místa pro traktory a kombajny: <b>${vehicleCount(farm)}/${slots}</b>. Za prodaný stroj dostaneš polovinu ceny.</p>${rows}
    ${upgradeBlock(farm, o)}<button class="btn alt" data-act="move" data-v="${o.id}">↔ Přesunout stodolu</button>`;
}

// stánek: nabídka se mění každé 2 hodiny
function stallHtml(farm, o, now) {
  const off = stallOffers(farm, now);
  const buy = off.buy.map((x, i) => {
    const left = stallLeft(farm, now, 'b', i, x.qty);
    return `<div class="row"><span class="ico">:${ITEMS[x.item].icon}:</span><div class="info"><b>${ITEMS[x.item].name}</b><small>${x.price} :coin: za kus · zbývá ${left}</small></div>
      <button class="btn sm${left && farm.coins >= x.price ? '' : ' off'}" data-act="stallBuy" data-v="${i}">Koupit 1</button></div>`;
  }).join('');
  const sell = off.sell.map((x, i) => {
    const left = stallLeft(farm, now, 's', i, x.qty);
    const h = have(farm, x.item);
    return `<div class="row"><span class="ico">:${ITEMS[x.item].icon}:</span><div class="info"><b>${ITEMS[x.item].name}</b><small>vykoupí ${left} ks po ${x.price} :coin: · máš ${h}</small></div>
      <button class="btn sm${left && h ? '' : ' off'}" data-act="stallSell" data-v="${i}" data-q="1">Prodat 1</button>
      <button class="btn sm${left && h ? '' : ' off'}" data-act="stallSell" data-v="${i}" data-q="all">Vše</button></div>`;
  }).join('');
  return `<p class="muted">:clock: Nová nabídka za <b>${fmtTime(Math.ceil((off.next - now) / 1000))}</b>. Ve stánku koupíš, co ti chybí (dráž), a prodáš za lepší cenu než ve výkupu skladu.</p>
    <p class="muted"><b>Stánek prodává</b></p>${buy}<p class="muted"><b>Stánek vykupuje</b></p>${sell}${upgradeBlock(farm, o)}`;
}

function newsHtml() {
  return NEWS.map(n => `<div class="news"><b>Verze ${n.v}: ${esc(n.title)}</b><ul>${n.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>`).join('');
}

function bigfieldHtml(farm, o, now) {
  const st = fieldState(o, now);
  const cells = o.w * o.h;
  const head = `<p class="muted">Velikost ${o.w}×${o.h} = <b>${cells} políček</b>.</p>`;
  const move = `<button class="btn alt" data-act="move" data-v="${o.id}">↔ Přesunout velké pole</button>`;
  const bar = p => `<div class="bar"><div style="width:${(p * 100).toFixed(1)}%"></div></div>`;
  if (st.state === 'empty') {
    const tr = freeMachine(farm, 'tractor', now);
    if (!tr) {
      return head + `<div class="empty">${hasMachine(farm, 'tractor') ? 'Traktor právě pracuje na jiném poli. Počkej, až se vrátí.' : 'K setí potřebuješ traktor. Kup ho v prodejně strojů :tractor: vlevo nahoře.'}</div>` + move;
    }
    const sec = Math.ceil(jobSeconds(cells, tr.model) / (hasTool(farm, 'seeder') ? 2 : 1));
    const soil = o.soil || 'raw';
    const soilTxt = soil === 'plowed' ? '<b>Zoráno</b> – úroda bude o 50 % větší.' : soil === 'stubble' ? 'Na poli je strniště.' : 'Pole není zorané.';
    let tools = '';
    if (o.straw && hasTool(farm, 'baler')) tools += `<button class="btn alt" data-act="fieldBale" data-v="${tr.id}">:lis: Slisovat slámu (${Math.floor(cells / 2)} balíků)</button>`;
    if (soil !== 'plowed' && hasTool(farm, 'plow')) tools += `<button class="btn alt" data-act="fieldPlow" data-v="${tr.id}">:pluh: Zorat pole (+50 % úrody)</button>`;
    const hint = !hasTool(farm, 'plow') && soil !== 'plowed' ? '<small>Tip: s pluhem z prodejny strojů bude úroda o 50 % větší.</small>' : '';
    const cards = CROP_LIST.map(c => card({ icon: c.icon, name: c.name, locked: farm.level < c.level, act: 'fieldSow', v: c.id,
      disabled: farm.coins < (cells - Math.min(cells, have(farm, 's_' + c.id))) * c.cost,
      lines: farm.level < c.level ? [`:lock: úroveň ${c.level}`]
        : [`osivo ${seedCost(farm, c, cells)}`, `úroda ${Math.round(cells * c.yield * (o.soil === 'plowed' ? 1.5 : 1))} :${c.icon}:`, `sklízí ${MACHINE_TYPE_NAME[c.harvester]}`] }));
    const mult = soil === 'plowed' ? 1.5 : 1;
    return head + `<p class="muted">${soilTxt} ${hint}</p>${tools}<p class="muted">Seje <b>${MACHINES[tr.model].name}</b>${hasTool(farm, 'seeder') ? ' se secím strojem' : ''} (${fmtTime(sec)}). Vyber plodinu:</p><div class="crops">${cards.join('')}</div>` + move;
  }
  const m = farm.machines.find(x => o.job && x.id === o.job.m);
  if (['sowing', 'harvesting', 'plowing', 'baling'].includes(st.state)) {
    const what = st.state === 'sowing' ? `seje ${CROPS[o.crop].name.toLowerCase()}`
      : st.state === 'harvesting' ? `sklízí ${ITEMS[o.load.item].name.toLowerCase()}`
      : st.state === 'plowing' ? 'orá pole' : 'lisuje slámu';
    const icon = st.state === 'plowing' ? 'pluh' : st.state === 'baling' ? 'lis' : MACHINES[m.model].icon;
    return head + `<div class="row"><span class="ico">:${icon}:</span><div class="info">
      <b>${MACHINES[m.model].name} ${what}</b><small>hotovo za ${fmtTime(st.left)}</small>${bar(st.progress)}</div></div>` + move;
  }
  if (st.state === 'growing') {
    const c = CROPS[o.crop];
    return head + `<div class="row"><span class="ico">:${c.icon}:</span><div class="info"><b>${c.name} roste</b><small>zralé za ${fmtTime(st.left)}</small>${bar(st.progress)}</div></div>` + move;
  }
  if (st.state === 'ready') {
    const c = CROPS[o.crop];
    const type = c.harvester;
    const hm = freeMachine(farm, type, now);
    const btn = hm ? `<button class="btn" data-act="fieldHarvest" data-v="${hm.id}">Sklidit – ${MACHINES[hm.model].name} (${fmtTime(jobSeconds(cells, hm.model))})</button>`
      : `<div class="empty">${hasMachine(farm, type) ? `Tvůj ${MACHINE_TYPE_NAME[type]} právě pracuje jinde.` : `Na sklizeň potřebuješ ${MACHINE_TYPE_NAME[type]} – kup ho v prodejně strojů :tractor:.`}</div>`;
    return head + `<p class="muted">:${c.icon}: ${c.name} je zralá: ${fieldYield(o)} kusů.</p>` + btn + move;
  }
  const it = ITEMS[st.item];
  return head + `<p class="muted">Hotovo. Na poli čeká ${st.stock} × :${it.icon}: ${it.name.toLowerCase()}.</p>
    <button class="btn" data-act="fieldUnload" data-v="${o.id}">:box: Odvézt do skladu</button>` + move;
}

function ingredients(farm, recipe) {
  return Object.entries(recipe.in).map(([id, n]) =>
    `<span class="${have(farm, id) >= n ? '' : 'miss'}">:${ITEMS[id].icon}:${have(farm, id)}/${n}</span>`).join(' ');
}

function factoryHtml(farm, o, now) {
  const d = BUILDINGS[o.kind];
  const q = queueState(o, now);
  const slots = [];
  const qs = queueSize(o);
  for (let i = 0; i < qs; i++) {
    const s = q[i];
    if (!s) { slots.push('<div class="slot empty">volno</div>'); continue; }
    const it = ITEMS[s.r];
    const info = s.state === 'done' ? '✓ hotovo' : s.state === 'working' ? fmtTime(s.left) : 'čeká';
    const bar = s.state === 'working' ? `<div class="bar"><div style="width:${(s.progress * 100).toFixed(1)}%"></div></div>` : '';
    slots.push(`<div class="slot ${s.state}"><span class="ico">:${it.icon}:</span><small>${info}</small>${bar}</div>`);
  }
  const done = q.filter(s => s.state === 'done').length;
  const recipes = Object.values(RECIPES).filter(r => r.building === o.kind).map(r => {
    const locked = farm.level < r.level;
    return card({
      icon: ITEMS[r.id].icon, name: (recipeQty(r) > 1 ? recipeQty(r) + '× ' : '') + ITEMS[r.id].name, locked, act: 'produce', v: r.id,
      disabled: !locked && (!hasInputs(farm, r) || q.length >= qs),
      lines: locked ? [`:lock: úroveň ${r.level}`] : [ingredients(farm, r), `:clock: ${fmtTime(r.time)} · ${ITEMS[r.id].price} :coin:`],
    });
  });
  return `<div class="slots">${slots.join('')}</div>
    ${done ? `<button class="btn" data-act="collect" data-v="${o.id}">Vybrat hotové (${done})</button>` : ''}
    <p class="muted">Vyber, co vyrobit (fronta až ${qs} výrobky):</p>
    <div class="crops">${recipes.join('')}</div>
    ${upgradeBlock(farm, o)}
    <button class="btn alt" data-act="move" data-v="${o.id}">↔ Přesunout ${esc(d.name)}</button>`;
}

function penHtml(farm, o, now) {
  const d = BUILDINGS[o.kind];
  const an = ANIMALS[d.animal];
  const rows = o.animals.map((a, i) => {
    const st = animalState(a, an, now);
    const txt = st.state === 'hungry' ? `má hlad – chce :${ITEMS[an.feed].icon}:` : st.state === 'ready' ? `:${ITEMS[an.product].icon}: připraveno` : `:${ITEMS[an.product].icon}: za ${fmtTime(st.left)}`;
    const bar = st.state === 'eating' ? `<div class="bar"><div style="width:${(st.progress * 100).toFixed(1)}%"></div></div>` : '';
    return `<div class="row"><span class="ico">:${an.icon}:</span><div class="info"><b>${an.name} ${i + 1}</b><small>${txt}</small>${bar}</div></div>`;
  }).join('') || `<div class="empty">Ohrada je prázdná. Kup ${an.acc} v obchodě nebo tady.</div>`;
  const ready = o.animals.filter(a => animalState(a, an, now).state === 'ready').length;
